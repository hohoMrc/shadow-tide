// 存檔：最遠到過第幾關、全破幾次
const SAVE_KEY = 'shadowtide-progress';
function loadProgress() {
  try { return { reached: 1, cleared: 0, ...JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') }; }
  catch (_) { return { reached: 1, cleared: 0 }; }
}
function saveProgress(p) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(p)); } catch (_) {} }

// ============================================================
//  遊戲狀態
// ============================================================
const game = { mode: 'title' };
// 網址加 ?debug：滿級武器＋配方被動、每關 20 秒、魔王血量 3 成；再加 &stage=3 可從第 3 關開始
let debug = false, stageTime = STAGE_TIME;

function newGame() {
  const params = new URLSearchParams(location.search);
  debug = params.has('debug');
  stageTime = debug ? 20 : STAGE_TIME;
  Object.assign(game, {
    mode: 'play', t: 0, kills: 0, shake: 0,
    pendingLevels: 0, pendingChests: 0, starterChest: false,
    rings: [], particles: [], texts: [], pops: [],
    combo: 0, comboT: 0, bestCombo: 0, gemCombo: 0, gemT: 0,
    weapons: [], passives: {}, stardust: 0,
  });
  sfx.init();
  game.player = {
    x: 0, y: 0, r: 14, hp: 100, maxHp: 100, iframe: 0,
    speed: 150, moveMul: 1, dmgMul: 1, cdMul: 1, pickup: 70, regen: 0, areaMul: 1, xpMul: 1,
    frenzyT: 0, shieldT: 0,
    lvl: 1, xp: 0, xpNext: xpNeed(1), faceX: 1, faceY: 0,
  };
  addWeapon('bolt');
  if (debug) {
    for (const id of ['bolt', 'orbit', 'pulse']) while ((game.weapons.find(w => w.id === id)?.lv || 0) < WEAPONS[id].max) addWeapon(id);
    for (const id of ['focus', 'vigor', 'might']) { game.passives[id] = 1; PASSIVES[id].apply(game.player); }
  }
  startStage(debug ? clamp((Number(params.get('stage')) || 1) - 1, 0, STAGES.length - 1) : 0);
  // 開局送一個寶箱（必定是新武器），放在角色上方，走幾步就撿得到
  game.gems.push({ x: game.player.x, y: game.player.y - 150, v: 0, kind: 'chest', starter: true, magnet: false });
  showOnly(null);
  $('hud').hidden = false;
}

function startStage(i) {
  const S = STAGES[i];
  Object.assign(game, {
    stage: i, st: 0, phase: 'waves', clearT: 0, boss: null,
    spawnAcc: 0, nextElite: debug ? 5 : 60, nextRing: 90,
    enemies: [], bullets: [], gems: [], shots: [], zones: [], blades: [], fires: [], arcs: [],
    items: [], freezeT: 0, screenFlash: 0,
    banner: { title: `第 ${i + 1} 關　${S.name}`, sub: S.intro, t: 0 },
  });
  // 每關第一個道具：先等該關間隔的 6 成（debug 模式 3 秒就出）
  game.nextItem = debug ? 3 : nextItemDelay() * 0.6;
  setBossBar(null);
  const prog = loadProgress();
  if (i + 1 > prog.reached) { prog.reached = i + 1; saveProgress(prog); }
}

// 前期升級快（很快就有東西選），後期越來越慢，讓全部拿滿大約落在第 5 關
const xpNeed = lvl => Math.floor(5 + lvl * 7 + lvl * lvl * 2.2);

function addWeapon(id) {
  const w = game.weapons.find(w => w.id === id);
  if (w) w.lv++;
  else game.weapons.push({ id, lv: 1, timer: 0.3, angle: 0, orbs: [] });
}

// ============================================================
//  主迴圈
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);   // 切回分頁時不要一次跳太多
  last = now;
  if (game.mode === 'play') update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function update(dt) {
  const P = game.player;
  game.t += dt;
  game.st += dt;
  if (game.banner) game.banner.t += dt;

  // --- 玩家移動 ---
  const mv = readMove();
  P.slowT = Math.max(0, (P.slowT || 0) - dt);
  const speed = P.speed * P.moveMul * (P.slowT > 0 ? 0.55 : 1);
  P.x += mv.x * speed * dt;
  P.y += mv.y * speed * dt;
  P.moving = !!(mv.x || mv.y);
  if (P.moving) { P.faceX = mv.x; P.faceY = mv.y; }
  P.iframe -= dt;
  P.hp = Math.min(P.maxHp, P.hp + P.regen * dt);

  updateStage(dt);
  spawnEnemies(dt);
  buildGrid();
  updateEnemies(dt);
  updateItems(dt);
  const wdt = P.frenzyT > 0 ? dt * 2 : dt;   // 燈火狂熱：武器冷卻與旋轉都變兩倍快
  for (const w of game.weapons) WEAPON_UPDATE[WEAPONS[w.id].kind](w, wdt, WEAPONS[w.id].stat(w.lv));
  updateBullets(dt);
  updateAreaWeapons(dt);
  updateHazards(dt);
  updateGems(dt);
  updateFx(dt);

  game.enemies = game.enemies.filter(e => !e.dead);
  game.shake = Math.max(0, game.shake - dt * 30);

  if (P.hp <= 0) return endGame(false);
  // 寶箱優先：先進化，接下來的升級選項才會反映新武器
  if (game.pendingChests > 0) openChest();
  else if (game.pendingLevels > 0) openLevelUp();
  else if (game.phase === 'clear' && game.clearT > 2.5) openStageClear();
  updateHud();
}

// 關卡流程：撐滿時間 → 魔王 → 打倒後把地上的光晶全吸過來 → 過關畫面
function updateStage(dt) {
  if (game.phase === 'waves' && game.st >= stageTime) spawnBoss();
  if (game.phase === 'clear') {
    game.clearT += dt;
    for (const g of game.gems) g.magnet = true;
  }
}

// ============================================================
//  生怪：隨時間越來越快、越來越硬
// ============================================================
const viewRadius = () => Math.hypot(W, H) / 2 / zoom;

function spawnEnemies(dt) {
  if (game.phase === 'clear') return;
  const st = game.st;
  // 成群出現：同一個方向一次湧來一小團，掃過去才有「割草」的感覺
  // 魔王戰時小怪變少，讓玩家專心打王，但還是有經驗可以撿
  const rate = Math.min(6 + st / 5 + game.stage * 5, 70) * (game.phase === 'boss' ? 0.2 : 1);
  game.spawnAcc += dt * rate;
  const group = 4 + Math.floor(Math.random() * (4 + st / 40));
  if (game.spawnAcc >= group) {
    game.spawnAcc -= group;
    const a = Math.random() * Math.PI * 2, d = viewRadius() + 40;
    const cx = game.player.x + Math.cos(a) * d, cy = game.player.y + Math.sin(a) * d;
    const type = pickType();
    for (let i = 0; i < group; i++) spawnEnemy(type, cx + rand(-40, 40), cy + rand(-40, 40));
  }
  if (game.phase !== 'waves') return;
  // 每關第 60、120 秒各一隻菁英
  if (st >= game.nextElite) { game.nextElite += 60; spawnEnemy('elite'); }
  // 第 90 秒「包圍」：一圈影子同時出現
  if (st >= game.nextRing) {
    game.nextRing = Infinity;
    const n = 36, R = viewRadius() * 0.85;
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      spawnEnemy('wisp', game.player.x + Math.cos(a) * R, game.player.y + Math.sin(a) * R, true);
    }
  }
}

function pickType() {
  const table = STAGES[game.stage].mix.filter(([, , from]) => game.st >= from);
  let roll = Math.random() * table.reduce((s, [, w]) => s + w, 0);
  for (const [id, w] of table) if ((roll -= w) < 0) return id;
  return 'wisp';
}

function spawnEnemy(type, x, y, force) {
  if (!force && game.enemies.length >= MAX_ENEMIES) return;
  const T = ENEMY_TYPES[type];
  if (x === undefined) {
    const a = Math.random() * Math.PI * 2, d = viewRadius() + 40;
    x = game.player.x + Math.cos(a) * d;
    y = game.player.y + Math.sin(a) * d;
  }
  // 血量依「整趟累積時間」成長，因為流派會一路帶到後面的關卡
  const hp = T.hp * (1 + game.t / 120);
  const color = STAGES[game.stage].colors?.[type] || T.color;
  const e = { ...T, type, x, y, hp, maxHp: hp, color, vx: 0, vy: 0, flash: 0, orbitCd: 0, bladeCd: 0, stun: 0, dead: false,
    seed: Math.random() * 10 };   // seed：讓每隻怪的動畫相位不同，不會整群同步擺動
  game.enemies.push(e);
  return e;
}

function spawnBoss() {
  const P = game.player, B = STAGES[game.stage].boss;
  const a = Math.random() * Math.PI * 2, d = viewRadius() * 0.8;
  const hp = B.hp * (debug ? 0.3 : 1);
  const e = {
    ...ENEMY_TYPES.boss, type: 'boss', name: B.name, color: B.color,
    r: B.r || 46, speed: B.speed || 70,
    x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d,
    hp, maxHp: hp, vx: 0, vy: 0, flash: 0, orbitCd: 0, bladeCd: 0, stun: 0, dead: false, seed: 0,
    // 每招各自倒數；一開始先等 6 成冷卻，不會一出場就放招
    attacks: B.attacks.map(([id, cd]) => ({ id, cd, t: cd * 0.6 })),
    state: 'chase', stateT: 0, dirX: 0, dirY: 0, sprayRot: 0,
  };
  game.enemies.push(e);
  game.boss = e;
  game.phase = 'boss';
  game.banner = { title: `${B.name} 降臨`, sub: '打倒魔王即可過關', t: 0, danger: true };
  game.shake = 12;
  sfx.elite();
  setBossBar(e);
}

// ============================================================
//  敵人行為
// ============================================================
function updateEnemies(dt) {
  const P = game.player;
  const far = viewRadius() * 2;
  for (const e of game.enemies) {
    if (e.dead) continue;
    let dx = P.x - e.x, dy = P.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    // 跑太遠的敵人搬回畫面邊緣，不然玩家一直跑就甩掉了
    if (d > far) {
      const a = Math.random() * Math.PI * 2, r = viewRadius() + 40;
      e.x = P.x + Math.cos(a) * r; e.y = P.y + Math.sin(a) * r;
      continue;
    }
    // 預設：朝玩家直線前進；特殊怪由各自的 AI 改寫方向和速度
    const mv = { x: dx / d, y: dy / d, sp: e.speed };
    const frozen = game.freezeT > 0;   // 時之沙：完全停住，也不會出招
    if (frozen) mv.sp = 0;
    else if (e.ai === 'spit') spitterAI(e, dt, d, mv);
    else if (e.ai === 'charge') chargerAI(e, dt, d, mv);
    else if (e.ai === 'boss') bossAI(e, dt, d, mv);
    // 暈眩中不會移動，但仍會被擊退
    if (e.stun > 0) mv.sp = 0;
    e.stun -= dt;
    e.x += (mv.x * mv.sp + e.vx) * dt;
    e.y += (mv.y * mv.sp + e.vy) * dt;
    // 擊退速度逐漸衰減
    const decay = Math.min(1, 8 * dt);
    e.vx -= e.vx * decay; e.vy -= e.vy * decay;
    e.flash -= dt;

    // 互相推開，避免全部疊成一團（魔王不會被小怪推動）
    if (!e.boss) forNear(e.x, e.y, e.r * 2, o => {
      if (o === e) return;
      const ox = e.x - o.x, oy = e.y - o.y, min = e.r + o.r;
      const dd = ox * ox + oy * oy;
      if (dd > 0.01 && dd < min * min) {
        const dist = Math.sqrt(dd), push = (min - dist) * 0.25;
        e.x += ox / dist * push; e.y += oy / dist * push;
      }
    });

    if (!frozen && d < e.r + P.r) damagePlayer(e.dmg);
  }
}

// 吐影／冰影：保持 200～260 的距離繞著你走，定時射擊（冰影是三發扇形、會減速）
const DEFAULT_SHOT = { count: 1, spread: 0, speed: 170, cd: 2.6, slow: false };
function spitterAI(e, dt, d, mv) {
  const aim = Math.atan2(mv.y, mv.x);   // 先記下朝向玩家的角度，下面會改掉移動方向
  if (d < 200) { mv.x = -mv.x; mv.y = -mv.y; }
  else if (d < 260) { const t = mv.x; mv.x = -mv.y; mv.y = t; mv.sp *= 0.6; }
  const S = e.shot || DEFAULT_SHOT;
  e.fire = (e.fire ?? rand(1, 2.5)) - dt;
  if (e.fire <= 0 && d < 420) {
    e.fire = S.cd;
    for (let i = 0; i < S.count; i++)
      enemyShot(e.x, e.y, aim + (i - (S.count - 1) / 2) * S.spread, S.speed, 8 + game.stage * 2, S.slow);
  }
}

// 衝影：靠近後停下蓄力（會閃），再朝蓄力時鎖定的方向直線衝刺
function chargerAI(e, dt, d, mv) {
  e.cool = (e.cool ?? 0) - dt;
  e.ct = (e.ct ?? 0) - dt;
  if (!e.cs) e.cs = 'walk';
  if (e.cs === 'walk' && d < 260 && e.cool <= 0) {
    e.cs = 'wind'; e.ct = 0.55; e.dirX = mv.x; e.dirY = mv.y;
  } else if (e.cs === 'wind') {
    mv.sp = 0;
    if (e.ct <= 0) { e.cs = 'dash'; e.ct = 0.45; }
  } else if (e.cs === 'dash') {
    mv.x = e.dirX; mv.y = e.dirY; mv.sp = 380;
    if (e.ct <= 0) { e.cs = 'walk'; e.cool = 2.5; }
  }
}

// 魔王：平常追玩家，各招式冷卻到了就放；半血以下狂暴，出招變快
function bossAI(e, dt, d, mv) {
  const enraged = e.hp < e.maxHp / 2;
  e.stateT -= dt;
  if (e.state === 'wind') {            // 衝撞前的預告：停住，畫出衝刺路線
    mv.sp = 0;
    if (e.stateT <= 0) { e.state = 'dash'; e.stateT = 0.55; }
    return;
  }
  if (e.state === 'dash') {
    mv.x = e.dirX; mv.y = e.dirY; mv.sp = 540;
    if (e.stateT <= 0) e.state = 'chase';
    return;
  }
  const speedUp = enraged ? (game.stage === STAGES.length - 1 ? 1.6 : 1.3) : 1;
  for (const atk of e.attacks) {
    atk.t -= dt * speedUp;
    if (atk.t > 0) continue;
    atk.t = atk.cd;
    BOSS_ATTACKS[atk.id](e, mv, enraged);
    break;                              // 一格只放一招
  }
}

const BOSS_ATTACKS = {
  dash(e, mv) { e.state = 'wind'; e.stateT = 0.6; e.dirX = mv.x; e.dirY = mv.y; },
  summon(e) {
    const n = 10;
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      const m = spawnEnemy(pickType(), e.x + Math.cos(a) * (e.r + 60), e.y + Math.sin(a) * (e.r + 60), true);
      if (game.pops.length < 80) game.pops.push({ x: m.x, y: m.y, r: m.r, age: 0 });
    }
  },
  spray(e, mv, enraged) {
    const n = enraged ? 18 : 14;
    e.sprayRot += 0.3;
    const ice = !!STAGES[game.stage].boss.iceShots;
    for (let i = 0; i < n; i++) enemyShot(e.x, e.y, e.sprayRot + i / n * Math.PI * 2, 165, 10 + game.stage * 2, ice);
  },
  slam() {
    const P = game.player;
    const spots = [[0, 0], [rand(-120, 120), rand(-120, 120)], [rand(-120, 120), rand(-120, 120)]];
    for (const [ox, oy] of spots) game.zones.push({ x: P.x + ox, y: P.y + oy, r: 75, delay: 0.9, age: 0, dmg: 18 + game.stage * 3 });
  },
};

// ============================================================
//  隨機道具：每隔一段時間在玩家附近出現，要走過去撿
// ============================================================
const ITEMS = {
  soup:   { name: '熱湯',     icon: '✚', color: '#7dff9b', weight: 25, desc: '回復 30% 生命' },
  vacuum: { name: '磁暴',     icon: '∪', color: '#7be0ff', weight: 20, desc: '吸取全地圖光晶' },
  bomb:   { name: '晨光彈',   icon: '✺', color: '#fff3c4', weight: 12, desc: '畫面內小怪全滅' },
  freeze: { name: '時之沙',   icon: '❄', color: '#a0d7ff', weight: 15, desc: '凍結敵人 4 秒' },
  frenzy: { name: '燈火狂熱', icon: 'ϟ', color: '#ffc857', weight: 15, desc: '攻速加倍 8 秒' },
  shield: { name: '守護燈罩', icon: '◯', color: '#d9b8ff', weight: 13, desc: '無敵 6 秒' },
};
const ITEM_LIFE = 30;   // 地上放多久會消失
// 每關的道具生成間隔（秒）與地上同時存在的上限：越後面越密
const ITEM_RATE = [
  { min: 20, max: 35, cap: 3 },   // 第 1 關
  { min: 17, max: 29, cap: 3 },
  { min: 14, max: 24, cap: 4 },
  { min: 11, max: 19, cap: 4 },
  { min: 8,  max: 14, cap: 5 },   // 第 5 關
];
const nextItemDelay = () => { const R = ITEM_RATE[game.stage]; return rand(R.min, R.max); };

function updateItems(dt) {
  const P = game.player;
  game.freezeT = Math.max(0, game.freezeT - dt);
  P.frenzyT = Math.max(0, P.frenzyT - dt);
  P.shieldT = Math.max(0, P.shieldT - dt);

  // 依關卡間隔生成（過關演出中不生），地上有上限
  game.nextItem -= dt;
  if (game.nextItem <= 0 && game.phase !== 'clear') {
    game.nextItem = nextItemDelay();
    if (game.items.length < ITEM_RATE[game.stage].cap) {
      const a = Math.random() * Math.PI * 2, d = rand(200, 420);
      game.items.push({ kind: rollItem(), x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d, life: ITEM_LIFE });
    }
  }
  for (const it of game.items) {
    it.life -= dt;
    if (Math.hypot(it.x - P.x, it.y - P.y) < P.r + 18) { useItem(it.kind); it.life = 0; }
  }
  game.items = game.items.filter(it => it.life > 0);
}

// 依權重抽道具；血量越低，熱湯的權重越高
function rollItem() {
  const P = game.player;
  const table = Object.entries(ITEMS).map(([id, I]) => [id, id === 'soup' ? I.weight * (2.5 - 2 * P.hp / P.maxHp) : I.weight]);
  let roll = Math.random() * table.reduce((s, [, w]) => s + w, 0);
  for (const [id, w] of table) if ((roll -= w) < 0) return id;
  return 'soup';
}

function useItem(kind) {
  const P = game.player, I = ITEMS[kind];
  sfx.item();
  addText(P.x, P.y - 34, `${I.name}！`, I.color, true);
  burst(P.x, P.y, I.color, 16);
  if (kind === 'soup') P.hp = Math.min(P.maxHp, P.hp + P.maxHp * 0.3);
  else if (kind === 'vacuum') for (const g of game.gems) g.magnet = true;
  else if (kind === 'freeze') game.freezeT = 4;
  else if (kind === 'frenzy') P.frenzyT = 8;
  else if (kind === 'shield') P.shieldT = 6;
  else if (kind === 'bomb') {
    // 畫面內的小怪全部擊殺（照常掉經驗），魔王扣 8% 血
    const R = viewRadius();
    game.screenFlash = 0.5;
    game.shake = 14;
    sfx.boom();
    for (const e of game.enemies) {
      if (e.dead || Math.hypot(e.x - P.x, e.y - P.y) > R) continue;
      hurt(e, e.boss ? e.maxHp * 0.08 : e.hp + 1);
    }
    game.shots = [];
  }
}

// ============================================================
//  敵方子彈與重擊落點
// ============================================================
function enemyShot(x, y, a, speed, dmg, slow = false) {
  if (game.shots.length > 300) return;
  game.shots.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 6, dmg, life: 4, slow });
}

function updateHazards(dt) {
  const P = game.player;
  for (const s of game.shots) {
    if (game.freezeT > 0) continue;
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (Math.hypot(s.x - P.x, s.y - P.y) < s.r + P.r && P.iframe <= 0) {
      damagePlayer(s.dmg);
      if (s.slow) P.slowT = 1.5;          // 冰晶：減速 1.5 秒
      s.life = 0;
    }
  }
  game.shots = game.shots.filter(s => s.life > 0);
  for (const z of game.zones) {
    if (game.freezeT > 0) continue;
    z.age += dt;
    if (z.age >= z.delay) {
      if (Math.hypot(z.x - P.x, z.y - P.y) < z.r + P.r) damagePlayer(z.dmg);
      game.rings.push({ x: z.x, y: z.y, max: z.r, life: 0.3, age: 0, color: '255,93,115' });
      game.shake = Math.max(game.shake, 5);
    }
  }
  game.zones = game.zones.filter(z => z.age < z.delay);
}

function damagePlayer(dmg) {
  const P = game.player;
  if (P.iframe > 0 || P.shieldT > 0) return;
  P.hp -= dmg;
  P.iframe = 0.5;
  game.shake = 8;
  sfx.hurt();
  addText(P.x, P.y - 24, dmg, '#ff5d73');
}

function hurt(e, dmg, kx = 0, ky = 0) {
  if (e.dead) return;
  e.hp -= dmg;
  e.flash = 0.08;
  // 菁英比較難推，魔王推不動
  const kb = e.boss ? 0 : e.elite ? 0.2 : 1;
  e.vx += kx * kb; e.vy += ky * kb;
  addText(e.x, e.y - e.r, Math.round(dmg), '#fff');
  if (e.hp > 0) { sfx.hit(); return; }

  e.dead = true;
  game.kills++;
  game.combo++; game.comboT = 0;
  game.bestCombo = Math.max(game.bestCombo, game.combo);
  burst(e.x, e.y, e.color, e.boss ? 80 : e.elite ? 40 : 10);
  if (game.pops.length < 80) game.pops.push({ x: e.x, y: e.y, r: e.r, age: 0 });
  if (e.boss) return bossDefeated(e);
  if (e.elite) { sfx.elite(); game.shake = 10; } else sfx.kill();
  game.gems.push({ x: e.x, y: e.y, v: e.xp, kind: 'xp', magnet: false });
  if (e.elite) {
    game.gems.push({ x: e.x + 14, y: e.y, v: 30, kind: 'heal', magnet: false });
    game.gems.push({ x: e.x - 14, y: e.y, v: 0, kind: 'chest', magnet: false });
  }
  // 屍影死掉分裂成兩隻小的
  if (e.ai === 'split') for (const s of [-1, 1]) spawnEnemy('mite', e.x + s * 10, e.y, true);
}

// 魔王倒下：全場小怪一起爆掉、噴出大量光晶和寶箱
function bossDefeated(e) {
  game.boss = null;
  game.phase = 'clear';
  game.clearT = 0;
  game.shots = []; game.zones = [];
  game.shake = 16;
  sfx.elite(); sfx.chest();
  setBossBar(null);
  for (const o of game.enemies) {
    if (o.dead) continue;
    o.dead = true;
    burst(o.x, o.y, o.color, 3);
    game.gems.push({ x: o.x, y: o.y, v: o.xp, kind: 'xp', magnet: false });
  }
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    game.gems.push({ x: e.x + Math.cos(a) * 40, y: e.y + Math.sin(a) * 40, v: 10 + game.stage * 5, kind: 'xp', magnet: false });
  }
  game.gems.push({ x: e.x, y: e.y, v: 0, kind: 'chest', magnet: false });
  game.banner = { title: `擊敗 ${e.name}！`, sub: '', t: 0 };
}

// ============================================================
//  武器行為
// ============================================================
function nearestEnemy(x, y, maxD) {
  let best = null, bd = maxD * maxD;
  for (const e of game.enemies) {
    if (e.dead) continue;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

// 依攻擊方式分三種行為，s 是該武器目前等級的數值
const WEAPON_UPDATE = {
  shoot(w, dt, s) {
    w.timer -= dt;
    if (w.timer > 0) return;
    const P = game.player;
    // 魔王戰時每隔一輪鎖定魔王，不然子彈全被周圍的小怪吃掉
    w.volley = (w.volley || 0) + 1;
    const boss = game.boss;
    const target = boss && w.volley % 2 && Math.hypot(boss.x - P.x, boss.y - P.y) < 600 ? boss : nearestEnemy(P.x, P.y, 600);
    if (!target) { w.timer = 0.1; return; }
    const base = Math.atan2(target.y - P.y, target.x - P.x);
    for (let i = 0; i < s.count; i++) {
      const a = base + (i - (s.count - 1) / 2) * s.spread;
      game.bullets.push({
        x: P.x, y: P.y, vx: Math.cos(a) * s.speed, vy: Math.sin(a) * s.speed,
        r: s.r * P.areaMul, color: s.color, dmg: s.dmg * P.dmgMul, pierce: s.pierce, life: 1.3, hit: new Set(),
      });
    }
    w.timer = s.cd * P.cdMul;
  },

  orbit(w, dt, s) {
    const P = game.player;
    w.angle += s.spin * dt;
    // 光域讓燈火變大、軌道稍微變寬
    const size = s.size * P.areaMul, radius = s.radius * (1 + (P.areaMul - 1) / 2);
    w.size = size;
    w.orbs = [];
    for (let i = 0; i < s.count; i++) {
      const a = w.angle + i / s.count * Math.PI * 2;
      const ox = P.x + Math.cos(a) * radius, oy = P.y + Math.sin(a) * radius;
      w.orbs.push({ x: ox, y: oy });
      forNear(ox, oy, size + 32, e => {
        if (e.orbitCd > game.t) return;          // 同一隻敵人一段時間內只吃一次
        if (Math.hypot(e.x - ox, e.y - oy) < e.r + size + 2) {
          const d = Math.hypot(e.x - P.x, e.y - P.y) || 1;
          hurt(e, s.dmg * P.dmgMul, (e.x - P.x) / d * 120, (e.y - P.y) / d * 120);
          e.orbitCd = game.t + s.hitCd;
        }
      });
    }
  },

  pulse(w, dt, s) {
    w.timer -= dt;
    if (w.timer > 0) return;
    const P = game.player, radius = s.radius * P.areaMul;
    game.rings.push({ x: P.x, y: P.y, max: radius, life: 0.35, age: 0, color: s.color });
    sfx.pulse();
    forNear(P.x, P.y, radius + 30, e => {
      const dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy) || 1;
      if (d < radius + e.r) {
        hurt(e, s.dmg * P.dmgMul, dx / d * 320, dy / d * 320);
        if (s.stun && !e.boss) e.stun = e.elite ? s.stun / 3 : s.stun;
      }
    });
    w.timer = s.cd * P.cdMul;
  },

  // 雷鏈：打中第一隻後，跳到附近還沒被打過的最近敵人
  chain(w, dt, s) {
    w.timer -= dt;
    if (w.timer > 0) return;
    const P = game.player, range = s.range * P.areaMul;
    let fired = false;
    for (let c = 0; c < s.casts; c++) {
      // 第一道打最近的，其餘從射程內隨機挑起點，才不會全部重疊
      let cur = c === 0 ? nearestEnemy(P.x, P.y, 450) : randomEnemy(P.x, P.y, 450);
      if (!cur) break;
      fired = true;
      const hit = new Set(), pts = [[P.x, P.y]];
      for (let j = 0; j <= s.jumps && cur; j++) {
        hit.add(cur);
        pts.push([cur.x, cur.y]);
        hurt(cur, s.dmg * P.dmgMul);
        let next = null, nd = range * range;
        const from = cur;
        forNear(from.x, from.y, range, e => {
          if (hit.has(e)) return;
          const d = (e.x - from.x) ** 2 + (e.y - from.y) ** 2;
          if (d < nd) { nd = d; next = e; }
        });
        cur = next;
      }
      if (game.arcs.length < 30) game.arcs.push({ pts, life: 0.15 });
    }
    if (fired) sfx.zap();
    w.timer = fired ? s.cd * P.cdMul : 0.1;
  },

  // 迴旋刃：朝最近的敵人丟出，軌跡跟著玩家移動，飛出去再飛回來
  boomerang(w, dt, s) {
    w.timer -= dt;
    if (w.timer > 0) return;
    const P = game.player;
    const t = nearestEnemy(P.x, P.y, 400);
    const base = t ? Math.atan2(t.y - P.y, t.x - P.x) : Math.atan2(P.faceY, P.faceX);
    for (let i = 0; i < s.count; i++) {
      game.blades.push({
        a: base + (i - (s.count - 1) / 2) * s.spread, age: 0, T: 1.1, x: P.x, y: P.y,
        range: s.range * P.areaMul, size: s.size * P.areaMul, dmg: s.dmg * P.dmgMul, big: s.size > 12,
      });
    }
    w.timer = s.cd * P.cdMul;
  },

  // 火油瓶：砸在隨機一隻敵人腳下，留下一段時間的火池
  pool(w, dt, s) {
    w.timer -= dt;
    if (w.timer > 0) return;
    const P = game.player;
    for (let i = 0; i < s.count && game.fires.length < 40; i++) {
      const t = randomEnemy(P.x, P.y, 380);
      game.fires.push({
        x: t ? t.x : P.x + rand(-150, 150), y: t ? t.y : P.y + rand(-150, 150),
        r: s.r * P.areaMul, life: s.dur, tick: 0, dmg: s.dmg * P.dmgMul, heal: s.heal,
      });
    }
    w.timer = s.cd * P.cdMul;
  },
};

// 從射程內隨機挑一隻敵人（抽幾次就好，不用掃整個陣列）
function randomEnemy(x, y, maxD) {
  const list = game.enemies;
  for (let i = 0; i < 12 && list.length; i++) {
    const e = list[Math.floor(Math.random() * list.length)];
    if (!e.dead && (e.x - x) ** 2 + (e.y - y) ** 2 < maxD * maxD) return e;
  }
  return nearestEnemy(x, y, maxD);
}

// 迴旋刃與火池每格的移動和傷害
function updateAreaWeapons(dt) {
  const P = game.player;
  for (const b of game.blades) {
    b.age += dt;
    const k = Math.sin(Math.PI * Math.min(1, b.age / b.T));   // 0 → 1 → 0：飛出去再回來
    b.x = P.x + Math.cos(b.a) * b.range * k;
    b.y = P.y + Math.sin(b.a) * b.range * k;
    forNear(b.x, b.y, b.size + 30, e => {
      if (e.bladeCd > game.t) return;            // 同一隻敵人 0.25 秒內只被切一次
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.size) {
        hurt(e, b.dmg, Math.cos(b.a) * 80, Math.sin(b.a) * 80);
        e.bladeCd = game.t + 0.25;
      }
    });
  }
  game.blades = game.blades.filter(b => b.age < b.T);

  for (const f of game.fires) {
    f.life -= dt; f.tick -= dt;
    if (f.tick > 0) continue;
    f.tick = 0.3;
    forNear(f.x, f.y, f.r + 30, e => {
      if (Math.hypot(e.x - f.x, e.y - f.y) < f.r + e.r * 0.5) hurt(e, f.dmg);
    });
    if (f.heal && Math.hypot(P.x - f.x, P.y - f.y) < f.r) P.hp = Math.min(P.maxHp, P.hp + 1.5);
  }
  game.fires = game.fires.filter(f => f.life > 0);
  for (const a of game.arcs) a.life -= dt;
  game.arcs = game.arcs.filter(a => a.life > 0);
}

function updateBullets(dt) {
  for (const b of game.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    forNear(b.x, b.y, b.r + 30, e => {
      if (b.hit.has(e)) return;
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.r) {
        hurt(e, b.dmg, b.vx * 0.15, b.vy * 0.15);
        b.hit.add(e);
        if (--b.pierce <= 0) { b.life = 0; return true; }
      }
    });
  }
  game.bullets = game.bullets.filter(b => b.life > 0);
}

// ============================================================
//  光晶（經驗）與升級
// ============================================================
function updateGems(dt) {
  const P = game.player;
  // 地上光晶太多時合併，避免越積越卡
  // （只合併經驗光晶，寶箱和回血不能被併掉）
  if (game.gems.length > 400) {
    const i = game.gems.findIndex(g => g.kind === 'xp');
    const j = game.gems.findIndex((g, k) => k !== i && g.kind === 'xp');
    if (i >= 0 && j >= 0) { game.gems[j].v += game.gems[i].v; game.gems.splice(i, 1); }
  }
  for (const g of game.gems) {
    const dx = P.x - g.x, dy = P.y - g.y, d = Math.hypot(dx, dy) || 1;
    if (d < P.pickup) g.magnet = true;
    if (g.magnet) {
      const sp = 480 * dt;
      g.x += dx / d * sp; g.y += dy / d * sp;
    }
    if (d < P.r + 8) {
      g.taken = true;
      if (g.kind === 'heal') {
        P.hp = Math.min(P.maxHp, P.hp + g.v);
        addText(P.x, P.y - 24, '+' + g.v, '#7dff9b');
      } else if (g.kind === 'chest') {
        game.pendingChests++;
        if (g.starter) game.starterChest = true;
      }
      else {
        gainXp(g.v);
        game.gemCombo = game.gemT < 0.6 ? game.gemCombo + 1 : 0;
        game.gemT = 0;
        sfx.gem(game.gemCombo);
      }
    }
  }
  game.gems = game.gems.filter(g => !g.taken);
}

function gainXp(v) {
  const P = game.player;
  P.xp += v * P.xpMul;
  while (P.xp >= P.xpNext) {
    P.xp -= P.xpNext;
    P.lvl++;
    P.xpNext = xpNeed(P.lvl);
    game.pendingLevels++;
  }
}

// 隨機抽 3 個可選的強化（洗牌後取前 3）
function rollChoices() {
  const pool = [];
  for (const [id, W_] of Object.entries(WEAPONS)) {
    if (W_.evolved) continue;
    // 已經進化掉的武器，不能再當新武器拿一次
    const evolvedInto = EVOLUTIONS.find(r => r.from === id)?.into;
    if (evolvedInto && game.weapons.some(w => w.id === evolvedInto)) continue;
    const owned = game.weapons.find(w => w.id === id);
    if (owned && owned.lv < W_.max) pool.push({ kind: 'weapon', id, lv: owned.lv + 1 });
    if (!owned && game.weapons.length < MAX_WEAPONS) pool.push({ kind: 'weapon', id, lv: 1 });
  }
  const passiveCount = Object.keys(game.passives).length;
  for (const [id, P_] of Object.entries(PASSIVES)) {
    const lv = game.passives[id] || 0;
    if (lv === 0 && passiveCount >= MAX_PASSIVES) continue;
    if (lv < P_.max) pool.push({ kind: 'passive', id, lv: lv + 1 });
  }
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const picks = pool.slice(0, 3);
  // 能拿的都拿滿了：用保底選項補滿 3 格（星屑可以無限疊）
  for (const kind of ['stardust', 'heal']) if (picks.length < 3) picks.push({ kind });
  return picks;
}

let levelOpenedAt = 0;
function openLevelUp() {
  game.mode = 'levelup';
  game.pendingLevels--;
  sfx.levelUp();
  levelOpenedAt = performance.now();
  stick.id = null;
  const box = $('choices');
  box.innerHTML = '';
  for (const c of rollChoices()) {
    let icon, name, desc, tag = '';
    if (c.kind === 'weapon') {
      const D = WEAPONS[c.id];
      icon = D.icon; name = D.name;
      desc = c.lv === 1 ? `${D.blurb}　${D.desc(D.stat(1))}` : D.desc(D.stat(c.lv));
      tag = c.lv === 1 ? '新武器' : c.lv === D.max ? '滿級' : '';
      const evo = EVOLUTIONS.find(r => r.from === c.id);
      if (evo && c.lv === D.max) {
        desc += game.passives[evo.need]
          ? `<br>✓ 已有「${PASSIVES[evo.need].name}」，打倒菁英撿寶箱即可進化`
          : `<br>搭配「${PASSIVES[evo.need].name}」可進化成「${WEAPONS[evo.into].name}」`;
      }
    } else if (c.kind === 'passive') {
      const D = PASSIVES[c.id];
      icon = D.icon; name = D.name; desc = D.desc;
      // 是手上某把武器的進化素材，而且還沒拿過，就標出來
      const evo = EVOLUTIONS.find(r => r.need === c.id && game.weapons.some(w => w.id === r.from));
      if (evo && c.lv === 1) {
        tag = '進化素材';
        desc += `<br>${WEAPONS[evo.from].name}滿級後可進化成「${WEAPONS[evo.into].name}」`;
      }
    } else if (c.kind === 'stardust') {
      icon = '✧'; name = '星屑'; desc = '所有傷害 +3%（可以無限疊加）';
    } else {
      icon = '✚'; name = '熱湯'; desc = '回復 40 生命';
    }
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = `<span class="icon">${icon}</span>
      <span class="name">${name}${c.lv ? `<em>Lv.${c.lv}</em>` : ''}${tag ? `<span class="tag">${tag}</span>` : ''}</span>
      <span class="desc">${desc}</span>`;
    btn.onclick = () => {
      if (performance.now() - levelOpenedAt < 250) return;   // 防止升級瞬間手指剛好點到
      applyChoice(c);
    };
    box.appendChild(btn);
  }
  $('levelSlots').innerHTML = slotsHtml();
  showOnly('levelScreen');
}

function applyChoice(c) {
  applyUpgrade(c);
  continueQueue();
}

// 套用一個升級選項，回傳顯示用的文字（寶箱畫面會用到）
function applyUpgrade(c) {
  const P = game.player;
  if (c.kind === 'weapon') {
    addWeapon(c.id);
    return `${WEAPONS[c.id].icon} ${WEAPONS[c.id].name} Lv.${c.lv}`;
  }
  if (c.kind === 'passive') {
    game.passives[c.id] = (game.passives[c.id] || 0) + 1;
    PASSIVES[c.id].apply(P);
    return `${PASSIVES[c.id].icon} ${PASSIVES[c.id].name} Lv.${c.lv}`;
  }
  if (c.kind === 'stardust') {
    P.dmgMul += 0.03;
    game.stardust = (game.stardust || 0) + 1;
    return '✧ 星屑：所有傷害 +3%';
  }
  P.hp = Math.min(P.maxHp, P.hp + 40);
  return '✚ 回復 40 生命';
}

// 依序處理還沒打開的寶箱和升級，都處理完才回到遊戲
function continueQueue() {
  if (game.pendingChests > 0) openChest();
  else if (game.pendingLevels > 0) openLevelUp();
  else { game.mode = 'play'; last = performance.now(); showOnly(null); }
}

// ============================================================
//  寶箱：有符合條件的武器就進化，沒有就送一次免費升級
// ============================================================
const evolvable = () => EVOLUTIONS.filter(r => {
  const w = game.weapons.find(w => w.id === r.from);
  return w && w.lv >= WEAPONS[r.from].max && game.passives[r.need];
});

function openChest() {
  game.mode = 'chest';
  game.pendingChests--;
  sfx.chest();
  levelOpenedAt = performance.now();
  stick.id = null;
  const ready = evolvable();
  let html;
  // 開局寶箱：從還沒擁有的武器裡抽一把
  const starter = game.starterChest;
  game.starterChest = false;
  const fresh = Object.keys(WEAPONS).filter(id => !WEAPONS[id].evolved
    && !game.weapons.some(w => w.id === id || w.id === EVOLUTIONS.find(r => r.from === id)?.into));
  if (starter && fresh.length) {
    const id = fresh[Math.floor(Math.random() * fresh.length)];
    addWeapon(id);
    const D = WEAPONS[id];
    $('chestTitle').textContent = '新武器！';
    html = `<div class="evo"><span class="to">${D.icon}<small>${D.name}</small></span></div><p>${D.blurb}</p>`;
  } else if (ready.length) {
    const r = ready[Math.floor(Math.random() * ready.length)];
    const w = game.weapons.find(w => w.id === r.from);
    // 直接把武器換成進化版，保留原本的計時與角度，攻擊不會中斷
    w.id = r.into; w.lv = 1;
    const F = WEAPONS[r.from], T = WEAPONS[r.into];
    $('chestTitle').textContent = '進化！';
    html = `<div class="evo">
      <span class="from">${F.icon}<small>${F.name}</small></span>
      <span class="arrow">→</span>
      <span class="to">${T.icon}<small>${T.name}</small></span>
    </div><p>${T.blurb}</p>`;
    burst(game.player.x, game.player.y, '#ffc857', 40);
  } else {
    // 沒有能進化的：從升級選項裡隨機送一個
    const label = applyUpgrade(rollChoices()[0]);
    $('chestTitle').textContent = '寶箱';
    html = `<p>獲得 <b style="color:var(--lamp)">${label}</b></p>
      <p class="hint">提示：武器滿級，再加上對應的被動，寶箱就會讓它進化</p>`;
  }
  $('chestBody').innerHTML = html;
  showOnly('chestScreen');
}

$('chestBtn').onclick = () => {
  if (performance.now() - levelOpenedAt < 250) return;
  continueQueue();
};

// ============================================================
//  特效
// ============================================================
function addText(x, y, txt, color, big = false) {
  if (game.texts.length > 60) game.texts.shift();
  game.texts.push({ x: x + (big ? 0 : rand(-6, 6)), y, txt, color, life: big ? 1.2 : 0.6, big });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n && game.particles.length < 600; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(60, 220);
    game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.55), size: rand(2.5, 6), color });
  }
}
function updateFx(dt) {
  for (const p of game.particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    p.vx *= 1 - 4 * dt; p.vy *= 1 - 4 * dt;   // 噴出去後很快減速，看起來比較有爆開的感覺
  }
  for (const p of game.pops) p.age += dt;
  game.pops = game.pops.filter(p => p.age < 0.22);
  game.comboT += dt; game.gemT += dt;
  game.screenFlash = Math.max(0, game.screenFlash - dt * 1.5);
  if (game.comboT > 1.5) game.combo = 0;
  for (const t of game.texts) { t.y -= 40 * dt; t.life -= dt; }
  for (const r of game.rings) r.age += dt;
  game.particles = game.particles.filter(p => p.life > 0);
  game.texts = game.texts.filter(t => t.life > 0);
  game.rings = game.rings.filter(r => r.age < r.life);
}

// ============================================================
//  繪圖
// ============================================================
function render() {
  const S = STAGES[game.stage || 0];
  ctx.fillStyle = S.bg;
  ctx.fillRect(0, 0, W, H);
  if (!game.player) return;
  const P = game.player;

  ctx.save();
  const sx = game.shake ? rand(-game.shake, game.shake) : 0;
  const sy = game.shake ? rand(-game.shake, game.shake) : 0;
  ctx.translate(W / 2 + sx, H / 2 + sy);
  ctx.scale(zoom, zoom);
  ctx.translate(-P.x, -P.y);

  drawGround(P, S);

  // 火池：橘色（聖火是金白色），邊緣微微閃動
  for (const f of game.fires) {
    const flick = 0.85 + 0.15 * Math.sin(game.t * 20 + f.x);
    const fade = Math.min(1, f.life * 2);
    ctx.fillStyle = f.heal ? `rgba(255,236,170,${0.22 * fade})` : `rgba(255,120,40,${0.22 * fade})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * flick, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = f.heal ? `rgba(255,250,220,${0.3 * fade})` : `rgba(255,190,90,${0.3 * fade})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.55 * flick, 0, Math.PI * 2); ctx.fill();
  }

  // 魔王重擊的預告落點：紅圈慢慢填滿，滿了就落下
  for (const z of game.zones) {
    const k = z.age / z.delay;
    ctx.fillStyle = `rgba(255,93,115,${0.12 + 0.18 * k})`;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,93,115,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r * k, 0, Math.PI * 2); ctx.stroke();
  }

  // 光晶
  for (const g of game.gems) {
    if (g.kind === 'chest') {
      // 寶箱：金色方塊＋一閃一閃的光暈
      const glow = 0.35 + 0.25 * Math.sin(game.t * 6);
      ctx.fillStyle = `rgba(255,200,87,${glow})`;
      ctx.beginPath(); ctx.arc(g.x, g.y, 22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8a5a1c'; ctx.fillRect(g.x - 11, g.y - 8, 22, 16);
      ctx.fillStyle = '#ffc857'; ctx.fillRect(g.x - 11, g.y - 2, 22, 3); ctx.fillRect(g.x - 2, g.y - 8, 4, 16);
      continue;
    }
    const s = g.kind === 'heal' ? 8 : g.v >= 10 ? 7 : g.v >= 3 ? 5.5 : 4.5;
    ctx.fillStyle = g.kind === 'heal' ? '#7dff9b' : g.v >= 10 ? '#c58bff' : g.v >= 3 ? '#8dffb0' : '#7be0ff';
    ctx.beginPath();
    ctx.moveTo(g.x, g.y - s); ctx.lineTo(g.x + s * 0.7, g.y);
    ctx.lineTo(g.x, g.y + s); ctx.lineTo(g.x - s * 0.7, g.y);
    ctx.fill();
  }

  // 隨機道具：上下浮動的光球＋圖示，快消失時閃爍
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const it of game.items) {
    if (it.life < 5 && Math.floor(it.life * 6) % 2 === 0) continue;
    const I = ITEMS[it.kind], y = it.y + Math.sin(game.t * 3 + it.x) * 4;
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = I.color;
    ctx.beginPath(); ctx.arc(it.x, y, 24 + Math.sin(game.t * 5) * 3, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#10121f';
    ctx.beginPath(); ctx.arc(it.x, y, 15, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = I.color; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = I.color;
    ctx.font = '700 17px "Noto Sans TC", sans-serif';
    ctx.fillText(I.icon, it.x, y + 1);
  }
  ctx.textBaseline = 'alphabetic';

  // 敵人：影子身體 + 一對發光眼睛看著玩家
  const frozenAll = game.freezeT > 0;
  // 畫面外的怪不畫（怪都從畫面外生成，隨時有不少在外面）；留 2.5 倍半徑的邊，尾巴和尖刺才不會被切掉
  const viewX = W / 2 / zoom, viewY = H / 2 / zoom;
  for (const e of game.enemies) {
    if (!e.boss && (Math.abs(e.x - P.x) > viewX + e.r * 2.5 || Math.abs(e.y - P.y) > viewY + e.r * 2.5)) continue;
    // 衝刺預告：魔王畫出整條衝刺路線，衝影則是身體一閃一閃
    if (e.state === 'wind') {
      ctx.strokeStyle = 'rgba(255,93,115,.35)'; ctx.lineWidth = e.r * 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + e.dirX * 300, e.y + e.dirY * 300); ctx.stroke();
      ctx.lineCap = 'butt';
    }
    if (e.boss) {   // 魔王外圈的脈動光暈
      ctx.strokeStyle = `rgba(255,93,115,${0.3 + 0.2 * Math.sin(game.t * 5)})`; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 8, 0, Math.PI * 2); ctx.stroke();
    }
    drawEnemy(e, P, frozenAll);
    if (e.elite) {   // 菁英頭上血條
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(e.x - 26, e.y - e.r - 12, 52, 5);
      ctx.fillStyle = '#ff5d73'; ctx.fillRect(e.x - 26, e.y - e.r - 12, 52 * Math.max(0, e.hp / e.maxHp), 5);
    }
  }

  // 震光環
  for (const r of game.rings) {
    const k = r.age / r.life;
    ctx.strokeStyle = `rgba(${r.color},${1 - k})`;
    ctx.lineWidth = 6 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.max * (0.3 + 0.7 * k), 0, Math.PI * 2); ctx.stroke();
  }

  // 守夜燈 / 烈日冠
  for (const w of game.weapons) if (WEAPONS[w.id].kind === 'orbit') for (const o of w.orbs) {
    ctx.fillStyle = 'rgba(255,200,87,.25)';
    ctx.beginPath(); ctx.arc(o.x, o.y, w.size * 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = WEAPONS[w.id].evolved ? '#fff1c2' : '#ffc857';
    ctx.beginPath(); ctx.arc(o.x, o.y, w.size, 0, Math.PI * 2); ctx.fill();
  }

  // 光彈：進化後的星河多一條拖尾
  for (const b of game.bullets) {
    if (b.r > 5) {
      ctx.strokeStyle = 'rgba(255,200,87,.35)'; ctx.lineWidth = b.r;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.05, b.y - b.vy * 0.05); ctx.stroke();
    }
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  }

  // 雷鏈：每段中間加一個隨機折點，看起來像閃電
  ctx.lineWidth = 2.5;
  for (const a of game.arcs) {
    ctx.strokeStyle = `rgba(191,230,255,${a.life / 0.15})`;
    ctx.beginPath();
    ctx.moveTo(a.pts[0][0], a.pts[0][1]);
    for (let i = 1; i < a.pts.length; i++) {
      const [x0, y0] = a.pts[i - 1], [x1, y1] = a.pts[i];
      ctx.lineTo((x0 + x1) / 2 + rand(-10, 10), (y0 + y1) / 2 + rand(-10, 10));
      ctx.lineTo(x1, y1);
    }
    ctx.stroke();
  }

  // 迴旋刃：旋轉的四角星
  for (const b of game.blades) {
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(b.age * 18);
    ctx.fillStyle = b.big ? '#fff1c2' : '#d8e3ff';
    const r = b.size, q = r * 0.28;
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.lineTo(q, q); ctx.lineTo(0, r); ctx.lineTo(-q, q);
    ctx.lineTo(-r, 0); ctx.lineTo(-q, -q); ctx.lineTo(0, -r); ctx.lineTo(q, -q);
    ctx.fill();
    ctx.restore();
  }

  // 敵方子彈：紅色帶光暈，和自己的暖黃色光彈分得開
  for (const b of game.shots) {
    if (b.slow) {   // 冰晶：沿飛行方向的藍白菱形
      const a = Math.atan2(b.vy, b.vx);
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(a);
      ctx.fillStyle = 'rgba(160,215,255,.3)';
      ctx.beginPath(); ctx.arc(0, 0, b.r * 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e4f4ff';
      ctx.beginPath(); ctx.moveTo(b.r * 1.8, 0); ctx.lineTo(0, b.r * 0.7); ctx.lineTo(-b.r * 1.2, 0); ctx.lineTo(0, -b.r * 0.7); ctx.fill();
      ctx.restore();
      continue;
    }
    ctx.fillStyle = 'rgba(255,93,115,.3)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff8fa3';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  }

  // 玩家：受傷無敵時閃爍
  if (P.iframe <= 0 || Math.floor(P.iframe * 20) % 2 === 0) drawPlayer(P);
  // 守護燈罩：紫色泡泡，快結束時閃爍；燈火狂熱：金色光暈
  if (P.shieldT > 0 && (P.shieldT > 1.5 || Math.floor(P.shieldT * 8) % 2 === 0)) {
    ctx.fillStyle = 'rgba(217,184,255,.15)'; ctx.strokeStyle = 'rgba(217,184,255,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(P.x, P.y, P.r + 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  if (P.frenzyT > 0) {
    ctx.strokeStyle = `rgba(255,200,87,${0.4 + 0.3 * Math.sin(game.t * 14)})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(P.x, P.y, P.r + 9 + Math.sin(game.t * 14) * 2, 0, Math.PI * 2); ctx.stroke();
  }

  // 被冰晶減速時，身上一圈冰藍
  if (P.slowT > 0) {
    ctx.strokeStyle = `rgba(160,215,255,${Math.min(1, P.slowT)})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(P.x, P.y, P.r + 5, 0, Math.PI * 2); ctx.stroke();
  }
  // 玩家血條
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(P.x - 18, P.y + P.r + 6, 36, 5);
  ctx.fillStyle = '#ff5d73'; ctx.fillRect(P.x - 18, P.y + P.r + 6, 36 * Math.max(0, P.hp / P.maxHp), 5);

  // 擊殺瞬間的白色光環
  for (const p of game.pops) {
    const k = p.age / 0.22;
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - k)})`;
    ctx.lineWidth = 3 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + 1.4 * k), 0, Math.PI * 2); ctx.stroke();
  }

  // 粒子
  for (const p of game.particles) {
    ctx.globalAlpha = Math.min(1, p.life * 3);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // 傷害數字
  ctx.font = '700 13px "Chakra Petch", monospace';
  ctx.textAlign = 'center';
  for (const t of game.texts) {
    ctx.globalAlpha = Math.min(1, t.life * 3);
    ctx.fillStyle = t.color;
    if (t.big) ctx.font = '900 18px "Noto Sans TC", sans-serif';
    ctx.fillText(t.txt, t.x, t.y);
    if (t.big) ctx.font = '700 13px "Chakra Petch", monospace';
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 夜色暗角：只有燈照得到的地方是亮的
  const g = ctx.createRadialGradient(W / 2, H / 2, 140 * zoom, W / 2, H / 2, Math.max(W, H) * 0.65);
  g.addColorStop(0, 'rgba(5,6,12,0)');
  g.addColorStop(1, 'rgba(5,6,12,.88)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 連殺：10 連以上才顯示，每殺一隻就彈一下
  if (game.combo >= 10 && game.mode !== 'over') {
    const pop = 1 + Math.max(0, 0.12 - game.comboT) * 3;
    const size = Math.min(22 + game.combo / 20, 40) * pop;
    ctx.save();
    if (!hudBottom) hudBottom = $('hud').getBoundingClientRect().bottom;
    ctx.translate(W / 2, hudBottom + 34);
    ctx.textAlign = 'center';
    ctx.globalAlpha = clamp(1.5 - game.comboT, 0, 1);
    ctx.fillStyle = '#ffc857';
    ctx.font = `700 ${size}px "Chakra Petch", monospace`;
    ctx.fillText(game.combo, 0, 0);
    ctx.font = '500 13px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#ece8f5';
    ctx.fillText('連殺', 0, 20);
    ctx.restore();
  }

  // 寶箱、魔王在畫面外時，在畫面邊緣畫一個指向它的箭頭
  const targets = game.gems.filter(g => g.kind === 'chest');
  if (game.boss) targets.push(game.boss);
  for (const it of game.items) targets.push(it);
  for (const c of targets) {
    const dx = (c.x - P.x) * zoom, dy = (c.y - P.y) * zoom;
    const mx = W / 2 - 30, my = H / 2 - 30;
    if (Math.abs(dx) < mx && Math.abs(dy) < my) continue;
    const k = Math.min(mx / Math.abs(dx || 1e-6), my / Math.abs(dy || 1e-6));
    const ax = W / 2 + dx * k, ay = H / 2 + dy * k, a = Math.atan2(dy, dx);
    ctx.save();
    ctx.translate(ax, ay); ctx.rotate(a);
    ctx.fillStyle = c.boss ? '#ff5d73' : c.kind in ITEMS ? ITEMS[c.kind].color : '#ffc857';
    const sz = c.boss ? 1.5 : c.kind in ITEMS ? 0.75 : 1;
    ctx.beginPath(); ctx.moveTo(12 * sz, 0); ctx.lineTo(-8 * sz, -9 * sz); ctx.lineTo(-8 * sz, 9 * sz); ctx.fill();
    ctx.restore();
  }

  // 關卡開始／魔王登場／擊敗魔王的大字橫幅，2.6 秒淡入淡出
  const B = game.banner;
  if (B && B.t < 2.6 && game.mode !== 'over') {
    const alpha = Math.min(1, B.t * 4, (2.6 - B.t) * 2);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.fillStyle = B.danger ? '#ff5d73' : '#ffc857';
    ctx.font = `900 ${Math.min(36, W / 11)}px "Noto Sans TC", sans-serif`;
    ctx.fillText(B.title, W / 2, H * 0.32);
    if (B.sub) {
      ctx.fillStyle = '#ece8f5';
      ctx.font = '500 15px "Noto Sans TC", sans-serif';
      ctx.fillText(B.sub, W / 2, H * 0.32 + 30);
    }
    ctx.restore();
  }

  // 時之沙：整個畫面淡淡的冰藍；晨光彈：白光一閃
  if (game.freezeT > 0) {
    ctx.fillStyle = `rgba(140,190,255,${0.12 * Math.min(1, game.freezeT)})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (game.screenFlash > 0) {
    ctx.fillStyle = `rgba(255,248,225,${game.screenFlash})`;
    ctx.fillRect(0, 0, W, H);
  }

  // 生效中的道具效果：畫面底部一排倒數
  const buffs = [
    ['frenzy', P.frenzyT], ['shield', P.shieldT], ['freeze', game.freezeT],
  ].filter(([, t]) => t > 0);
  if (buffs.length && game.mode !== 'over') {
    ctx.font = '700 14px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'center';
    const gap = 112, y0 = H - 36, x0 = W / 2 - (buffs.length - 1) * gap / 2;
    buffs.forEach(([id, t], i) => {
      const I = ITEMS[id], x = x0 + i * gap;
      ctx.fillStyle = 'rgba(16,18,31,.75)';
      ctx.beginPath(); ctx.roundRect(x - 50, y0 - 16, 100, 28, 14); ctx.fill();
      ctx.fillStyle = I.color;
      ctx.fillText(`${I.icon} ${I.name} ${t.toFixed(1)}`, x, y0 + 3);
    });
  }

  // 搖桿
  if (stick.id !== null && game.mode === 'play') {
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy, d = Math.hypot(dx, dy);
    const k = d > STICK_R ? STICK_R / d : 1;
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_R, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(stick.ox + dx * k, stick.oy + dy * k, 20, 0, Math.PI * 2); ctx.fill();
  }
}

// ============================================================
//  敵人外型：每種一個繪製函式，都在「面向玩家＝+x 方向」的局部座標裡畫
//  為了 650 隻怪也不卡，每種只用幾個簡單形狀
// ============================================================
function drawEnemy(e, P, frozen) {
  const a = Math.atan2(P.y - e.y, P.x - e.x);
  const winding = e.cs === 'wind' && Math.floor(game.t * 16) % 2 === 0;   // 衝影蓄力時閃白
  const body = e.flash > 0 || winding ? '#ffffff' : frozen ? '#8fb6d8' : e.color;
  const r = e.r * (e.flash > 0 ? 1.25 : 1);                               // 被打中時鼓起來
  const t = game.t + e.seed;
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(a);
  ctx.fillStyle = body;
  const shape = e.boss ? 'boss' : e.elite ? 'elite' : e.type;
  const eye = (ENEMY_SHAPES[shape] || ENEMY_SHAPES.wisp)(r, t, e, body);
  // 眼睛：預設在前方偏上下兩點；暈眩時變暗
  const [ex, spread, size, color] = eye || [0.35, 0.3, 0.12, '#ff8fa3'];
  ctx.fillStyle = e.stun > 0 ? '#6a6680' : color;
  const er = Math.max(1.6, r * size);
  ctx.beginPath();
  ctx.arc(r * ex, -r * spread, er, 0, Math.PI * 2);
  ctx.arc(r * ex, r * spread, er, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

const circle = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };
const SHADE = 'rgba(0,0,0,.28)';     // 疊在身體上的暗部，不用另外算每種顏色的深色版
const SHINE = 'rgba(255,255,255,.18)';

// 每個函式畫身體，回傳眼睛的位置 [往前多少, 上下間距, 大小, 顏色]（都是半徑的倍數）
const ENEMY_SHAPES = {
  // 小影：頭＋往後飄的尾巴
  wisp(r, t) {
    const w = Math.sin(t * 6) * r * 0.3;
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.85);
    ctx.quadraticCurveTo(-r * 1.3, -r * 0.5 + w, -r * 2.1, w * 1.4);
    ctx.quadraticCurveTo(-r * 1.3, r * 0.5 + w, 0, r * 0.85);
    ctx.fill();
    circle(0, 0, r);
  },
  // 疾影：箭頭形＋後方速度線
  runner(r) {
    ctx.beginPath();
    ctx.moveTo(r * 1.4, 0); ctx.lineTo(-r * 0.9, -r * 0.85); ctx.lineTo(-r * 0.45, 0); ctx.lineTo(-r * 0.9, r * 0.85);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = SHINE; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-r * 1.2, -r * 0.4); ctx.lineTo(-r * 2.2, -r * 0.4);
    ctx.moveTo(-r * 1.0, r * 0.4); ctx.lineTo(-r * 1.9, r * 0.4);
    ctx.stroke();
    return [0.45, 0.22, 0.13, '#9ff0ff'];
  },
  // 壯影：大胖身體＋一對往前彎的角＋暗色肚子
  brute(r) {
    ctx.beginPath();
    ctx.moveTo(r * 0.35, -r * 0.8); ctx.lineTo(r * 1.0, -r * 1.25); ctx.lineTo(r * 0.75, -r * 0.45);
    ctx.moveTo(r * 0.35, r * 0.8); ctx.lineTo(r * 1.0, r * 1.25); ctx.lineTo(r * 0.75, r * 0.45);
    ctx.fill();
    circle(0, 0, r);
    ctx.fillStyle = SHADE; circle(-r * 0.25, 0, r * 0.6);
    return [0.5, 0.28, 0.11, '#ffb38f'];
  },
  // 屍影：兩團黏在一起，中間一排縫線（暗示會分裂）
  splitter(r) {
    circle(-r * 0.1, -r * 0.38, r * 0.75);
    circle(-r * 0.1, r * 0.38, r * 0.75);
    ctx.strokeStyle = SHADE; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = -r * 0.7; x <= r * 0.5; x += r * 0.3) { ctx.moveTo(x, -r * 0.15); ctx.lineTo(x, r * 0.15); }
    ctx.moveTo(-r * 0.75, 0); ctx.lineTo(r * 0.55, 0);
    ctx.stroke();
    return [0.4, 0.42, 0.11, '#c8ff9f'];
  },
  // 小屍蟲：小圓球＋四隻會划動的腳
  mite(r, t) {
    const k = Math.sin(t * 18) * 0.35;
    ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (const s of [-1, 1]) {
      ctx.moveTo(r * 0.3, s * r * 0.5); ctx.lineTo(r * (0.8 + k), s * r * 1.3);
      ctx.moveTo(-r * 0.3, s * r * 0.5); ctx.lineTo(-r * (0.8 - k), s * r * 1.3);
    }
    ctx.stroke();
    circle(0, 0, r);
    return [0.35, 0.3, 0.16, '#c8ff9f'];
  },
  // 吐影：圓身體＋往前伸的吐管；快射擊時管口發紅
  spitter(r, t, e) {
    ctx.beginPath(); ctx.roundRect(r * 0.4, -r * 0.35, r * 1.0, r * 0.7, r * 0.2); ctx.fill();
    circle(0, 0, r);
    ctx.fillStyle = e.fire < 0.5 ? '#ff5d73' : SHADE;
    circle(r * 1.35, 0, r * 0.25);
    return [0.15, 0.45, 0.12, '#9fffe0'];
  },
  // 冰影：六角冰晶，慢慢自轉（只轉身體，眼睛仍看著玩家）
  frost(r, t) {
    ctx.save();
    ctx.rotate(t * 0.8);
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2, d = i % 2 ? r * 0.75 : r * 1.3;
      i ? ctx.lineTo(Math.cos(a) * d, Math.sin(a) * d) : ctx.moveTo(d, 0);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = SHINE;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; ctx.lineTo(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5); }
    ctx.closePath(); ctx.fill();
    ctx.restore();
    return [0.2, 0.25, 0.12, '#e4f4ff'];
  },
  // 衝影：甲蟲殼＋中線＋前方尖角
  charger(r) {
    ctx.beginPath();
    ctx.moveTo(r * 0.9, -r * 0.22); ctx.lineTo(r * 1.65, 0); ctx.lineTo(r * 0.9, r * 0.22);
    ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.15, r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = SHADE; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(-r * 1.1, 0); ctx.lineTo(r * 0.35, 0); ctx.stroke();
    ctx.fillStyle = SHINE;
    ctx.beginPath(); ctx.ellipse(-r * 0.25, -r * 0.4, r * 0.45, r * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    return [0.75, 0.28, 0.11, '#9fd4ff'];
  },
  // 菁英：大身體＋一圈金色尖刺
  elite(r, t, e, body) {
    ctx.fillStyle = '#ffdd55';
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2 + Math.sin(t) * 0.1;
      ctx.moveTo(Math.cos(a - 0.17) * r * 0.9, Math.sin(a - 0.17) * r * 0.9);
      ctx.lineTo(Math.cos(a) * r * 1.35, Math.sin(a) * r * 1.35);
      ctx.lineTo(Math.cos(a + 0.17) * r * 0.9, Math.sin(a + 0.17) * r * 0.9);
    }
    ctx.fill();
    ctx.fillStyle = body;
    circle(0, 0, r);
    ctx.fillStyle = SHADE; circle(-r * 0.2, 0, r * 0.55);
    return [0.4, 0.3, 0.13, '#ffdd55'];
  },
  // 魔王：外圈旋轉的大尖刺環＋身體＋暗色核心
  boss(r, t) {
    ctx.save();
    ctx.rotate(t * 0.6);
    ctx.beginPath();
    for (let i = 0; i < 14; i++) {
      const a = i / 14 * Math.PI * 2;
      ctx.moveTo(Math.cos(a - 0.14) * r * 0.85, Math.sin(a - 0.14) * r * 0.85);
      ctx.lineTo(Math.cos(a) * r * 1.4, Math.sin(a) * r * 1.4);
      ctx.lineTo(Math.cos(a + 0.14) * r * 0.85, Math.sin(a + 0.14) * r * 0.85);
    }
    ctx.fill();
    ctx.restore();
    circle(0, 0, r);
    ctx.fillStyle = SHADE; circle(-r * 0.15, 0, r * 0.65);
    ctx.fillStyle = SHINE; circle(-r * 0.15, 0, r * 0.3);
    return [0.45, 0.32, 0.12, '#ff5d73'];
  },
};

// 提燈旅人：深藍斗篷＋兜帽，手上提著燈籠
// 原點在角色腳底中心偏上（P.x, P.y），整個角色大約 28 寬、36 高，碰撞半徑仍是 P.r
function drawPlayer(P) {
  const t = game.t;
  // 面向：依水平移動方向左右翻轉，垂直移動時維持上一次的方向
  if (P.faceX > 0.15) P.dir = 1; else if (P.faceX < -0.15) P.dir = -1;
  const dir = P.dir || 1;
  const bob = P.moving ? Math.abs(Math.sin(t * 11)) * 2.5 : Math.sin(t * 2.2) * 0.7;   // 走路上下晃、站著輕微呼吸
  const sway = P.moving ? Math.sin(t * 11) * 2.2 : Math.sin(t * 2.2) * 0.5;            // 斗篷下襬擺動
  const swing = P.moving ? Math.sin(t * 11 + 1) * 0.35 : Math.sin(t * 2.2) * 0.08;    // 燈籠搖晃

  // 腳下影子（不跟著上下晃）
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(P.x, P.y + 13, 13, 4.5, 0, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.translate(P.x, P.y - bob);
  ctx.scale(dir, 1);

  // 斗篷身體：上窄下寬，下襬隨步伐左右擺
  ctx.fillStyle = '#2f3d6b';
  ctx.beginPath();
  ctx.moveTo(-6, -9);
  ctx.quadraticCurveTo(-13, 2, -12 + sway, 12);
  ctx.quadraticCurveTo(0, 15, 12 + sway, 12);
  ctx.quadraticCurveTo(13, 2, 6, -9);
  ctx.closePath();
  ctx.fill();
  // 下襬金邊
  ctx.strokeStyle = '#d9a441'; ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(-12 + sway, 12); ctx.quadraticCurveTo(0, 15, 12 + sway, 12);
  ctx.stroke();
  // 斗篷中間的開襟線
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(1, -6); ctx.lineTo(2 + sway * 0.4, 13); ctx.stroke();

  // 兜帽：往後拖一個尖角
  ctx.fillStyle = '#3a4c84';
  ctx.beginPath();
  ctx.moveTo(-6, -19); ctx.quadraticCurveTo(-13, -17, -12 - sway * 0.3, -9);
  ctx.lineTo(-4, -12); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -13, 9, 0, Math.PI * 2); ctx.fill();
  // 兜帽裡的暗臉，只露出兩點暖光眼睛
  ctx.fillStyle = '#100d1a';
  ctx.beginPath(); ctx.ellipse(3, -12, 5.2, 5.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffe3a3';
  ctx.beginPath();
  ctx.arc(2.2, -12.5, 1.3, 0, Math.PI * 2);
  ctx.arc(5.6, -12.5, 1.3, 0, Math.PI * 2);
  ctx.fill();

  // 提燈的手臂與燈桿
  ctx.strokeStyle = '#2f3d6b'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(5, -4); ctx.lineTo(11, -2); ctx.stroke();
  ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(10, -1); ctx.lineTo(16, -9); ctx.stroke();
  ctx.lineCap = 'butt';

  // 燈籠：掛在燈桿末端，依 swing 擺動
  ctx.save();
  ctx.translate(16, -9);
  ctx.rotate(swing);
  ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 3); ctx.stroke();
  ctx.fillStyle = '#8a5a1c';
  ctx.fillRect(-3.5, 3, 7, 2);                 // 燈蓋
  ctx.fillStyle = '#ffc857';
  ctx.beginPath(); ctx.roundRect(-3.5, 5, 7, 8, 2); ctx.fill();
  ctx.fillStyle = '#fff6d6';
  ctx.beginPath(); ctx.ellipse(0, 9, 1.6, 2.6, 0, 0, Math.PI * 2); ctx.fill();   // 火芯
  ctx.fillStyle = '#8a5a1c';
  ctx.fillRect(-3.5, 13, 7, 1.5);              // 燈底
  ctx.restore();

  ctx.restore();

  // 燈籠的光暈：疊加混色，照亮周圍
  const lx = P.x + dir * 16, ly = P.y - bob;
  const glow = ctx.createRadialGradient(lx, ly, 2, lx, ly, 70);
  glow.addColorStop(0, 'rgba(255,200,87,.35)');
  glow.addColorStop(1, 'rgba(255,200,87,0)');
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(lx, ly, 70, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// 地面：用格子座標做固定的偽隨機，讓裝飾位置每次經過都一樣；每關換一種裝飾
function drawGround(P, S) {
  const T = 90, R = viewRadius() + T;
  const x0 = Math.floor((P.x - R) / T), x1 = Math.floor((P.x + R) / T);
  const y0 = Math.floor((P.y - R) / T), y1 = Math.floor((P.y + R) / T);
  ctx.lineWidth = 2;
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
    const h = Math.abs(Math.sin(cx * 127.1 + cy * 311.7) * 43758.5453) % 1;
    const x = cx * T + (h * 7 % 1) * T, y = cy * T + (h * 13 % 1) * T;
    DECOR[S.decor](x, y, h, S);
  }
}

const tuft = (x, y, color) => {
  ctx.strokeStyle = color;
  ctx.beginPath();
  ctx.moveTo(x - 4, y); ctx.lineTo(x - 6, y - 8);
  ctx.moveTo(x, y); ctx.lineTo(x, y - 11);
  ctx.moveTo(x + 4, y); ctx.lineTo(x + 6, y - 8);
  ctx.stroke();
};
const dot = (x, y, r, color) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };

const DECOR = {
  grass(x, y, h, S) {
    if (h < 0.45) tuft(x, y, S.ink);
    else if (h < 0.6) dot(x, y, 3 + h * 4, S.ink2);
  },
  tomb(x, y, h, S) {   // 墓碑：圓頂長方形，偶爾是十字架
    if (h < 0.16) {
      ctx.fillStyle = S.ink;
      ctx.beginPath(); ctx.arc(x, y - 10, 8, Math.PI, 0); ctx.lineTo(x + 8, y + 8); ctx.lineTo(x - 8, y + 8); ctx.fill();
    } else if (h < 0.22) {
      ctx.fillStyle = S.ink;
      ctx.fillRect(x - 2, y - 14, 4, 22); ctx.fillRect(x - 8, y - 8, 16, 4);
    } else if (h < 0.5) tuft(x, y, S.ink2);
  },
  tree(x, y, h, S) {   // 樹冠：一大團深色圓
    if (h < 0.28) { dot(x, y, 16 + h * 40, S.ink2); dot(x + 6, y - 5, 10 + h * 20, S.ink); }
    else if (h < 0.55) tuft(x, y, S.ink);
  },
  ice(x, y, h, S) {    // 冰裂紋和小冰晶
    if (h < 0.3) {
      ctx.strokeStyle = S.ink;
      ctx.beginPath(); ctx.moveTo(x - 14, y - 6); ctx.lineTo(x, y + 2); ctx.lineTo(x + 12, y - 8); ctx.moveTo(x, y + 2); ctx.lineTo(x + 3, y + 14);
      ctx.stroke();
    } else if (h < 0.45) {
      ctx.fillStyle = S.ink2;
      ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x + 4, y); ctx.lineTo(x, y + 7); ctx.lineTo(x - 4, y); ctx.fill();
    }
  },
  blood(x, y, h, S) {
    if (h < 0.4) tuft(x, y, S.ink);
    else if (h < 0.6) dot(x, y, 4 + h * 6, S.ink2);
  },
};

// ============================================================
//  介面
// ============================================================
const SCREENS = ['titleScreen', 'levelScreen', 'chestScreen', 'clearScreen', 'pauseScreen', 'overScreen'];
function showOnly(id) { for (const s of SCREENS) $(s).hidden = s !== id; }

const hudCache = {};
function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
function updateHud() {
  const P = game.player;
  setText('lvl', P.lvl);
  setText('kills', game.kills);
  setText('stageLbl', `第 ${game.stage + 1} 關　${STAGES[game.stage].name}`);
  // 倒數到魔王出現；魔王戰中顯示「魔王」
  setText('time', game.phase === 'waves' ? fmtTime(Math.max(0, stageTime - game.st)) : game.phase === 'boss' ? '魔王' : '過關');
  $('xpFill').style.width = (P.xp / P.xpNext * 100).toFixed(1) + '%';
  if (game.boss) $('bossFill').style.width = (Math.max(0, game.boss.hp / game.boss.maxHp) * 100).toFixed(1) + '%';
}

function setBossBar(boss) {
  $('bossBar').hidden = !boss;
  if (boss) { $('bossName').textContent = boss.name; $('bossFill').style.width = '100%'; }
  hudBottom = 0;   // HUD 高度變了，連殺數字的位置要重算
}

// ============================================================
//  過關
// ============================================================
function openStageClear() {
  const i = game.stage;
  if (i === STAGES.length - 1) return endGame(true);
  game.mode = 'stageclear';
  levelOpenedAt = performance.now();
  stick.id = null;
  const N = STAGES[i + 1];
  $('clearTitle').textContent = `第 ${i + 1} 關　${STAGES[i].name}　完成！`;
  $('clearSub').innerHTML = `生命回復 50%<br>下一關：<b style="color:var(--ink)">第 ${i + 2} 關　${N.name}</b><br>${N.intro}`;
  $('clearBuild').innerHTML = buildHtml();
  showOnly('clearScreen');
}

$('nextBtn').onclick = () => {
  if (performance.now() - levelOpenedAt < 250) return;
  const P = game.player;
  P.hp = Math.min(P.maxHp, P.hp + P.maxHp * 0.5);
  startStage(game.stage + 1);
  game.mode = 'play';
  last = performance.now();
  showOnly(null);
};

// 標題畫面的關卡地圖：到過的關卡亮起來
function renderStageMap() {
  const prog = loadProgress();
  $('stageMap').innerHTML = STAGES.map((S, i) =>
    `<span class="${i < prog.reached ? 'on' : 'locked'}"><b>${i + 1}</b>${i < prog.reached ? S.name : '？？？'}</span>`).join('');
  $('stageNote').hidden = !prog.cleared;
  $('stageNote').textContent = `已破關 ${prog.cleared} 次`;
}
renderStageMap();

function buildHtml() {
  const items = [
    ...game.weapons.map(w => `<span>${WEAPONS[w.id].icon} ${WEAPONS[w.id].name}<em>${WEAPONS[w.id].evolved ? '★' : w.lv}</em></span>`),
    ...Object.entries(game.passives).map(([id, lv]) => `<span>${PASSIVES[id].icon} ${PASSIVES[id].name}<em>${lv}</em></span>`),
    ...(game.stardust ? [`<span>✧ 星屑<em>×${game.stardust}</em></span>`] : []),
  ];
  return items.join('');
}

// 武器與被動的欄位：已帶幾格、還剩幾格
function slotsHtml() {
  const row = (label, icons, max) => {
    const full = icons.length >= max;
    return `<div class="slot-row${full ? ' full' : ''}">
      <span class="slot-label">${label} <b>${icons.length}/${max}</b></span>
      ${icons.map(i => `<i>${i}</i>`).join('')}${'<i class="empty"></i>'.repeat(Math.max(0, max - icons.length))}
      <span class="slot-full">已滿</span></div>`;
  };
  return row('武器', game.weapons.map(w => WEAPONS[w.id].icon), MAX_WEAPONS)
       + row('被動', Object.keys(game.passives).map(id => PASSIVES[id].icon), MAX_PASSIVES);
}

// 每條配方的狀態：已進化 / 條件達成（等寶箱）/ 尚未達成
function recipesHtml() {
  const ready = evolvable();
  return EVOLUTIONS.map(r => {
    const F = WEAPONS[r.from], N = PASSIVES[r.need], T = WEAPONS[r.into];
    const cls = game.weapons.some(w => w.id === r.into) ? 'done' : ready.includes(r) ? 'ok' : '';
    return `<div class="${cls}">${F.icon} ${F.name} Lv.${F.max} ＋ ${N.icon} ${N.name} → ${T.icon} ${T.name}</div>`;
  }).join('');
}

function togglePause() {
  if (game.mode === 'play') {
    game.mode = 'paused';
    stick.id = null;
    $('pauseSlots').innerHTML = slotsHtml();
    $('pauseBuild').innerHTML = buildHtml();
    $('recipes').innerHTML = recipesHtml();
    showOnly('pauseScreen');
  } else if (game.mode === 'paused') {
    game.mode = 'play';
    last = performance.now();
    showOnly(null);
  }
}

function endGame(win) {
  game.mode = 'over';
  $('hud').hidden = true;
  setBossBar(null);
  const prog = loadProgress();
  if (win) { prog.cleared++; saveProgress(prog); }
  $('overTitle').textContent = win ? '天亮了' : '燈熄了';
  $('overTitle').style.color = win ? 'var(--lamp)' : '';
  $('overSub').textContent = (win ? '你穿越了五個夜晚。' : `最遠紀錄：第 ${prog.reached} 關`)
    + `　總時間 ${fmtTime(game.t)}　最高連殺 ${game.bestCombo}`;
  $('rStage').textContent = game.stage + 1;
  $('rLvl').textContent = game.player.lvl;
  $('rKills').textContent = game.kills;
  $('overBuild').innerHTML = buildHtml();
  showOnly('overScreen');
}

$('startBtn').onclick = newGame;
const syncMute = () => { $('muteBtn').textContent = sfx.muted ? '🔇' : '🔊'; };
$('muteBtn').onclick = () => { sfx.toggle(); syncMute(); };
syncMute();
$('againBtn').onclick = newGame;
$('quitBtn').onclick = newGame;
$('resumeBtn').onclick = togglePause;
$('pauseBtn').onclick = togglePause;
// 切到別的 App 或分頁時自動暫停
document.addEventListener('visibilitychange', () => { if (document.hidden && game.mode === 'play') togglePause(); });
</script>
</body>
