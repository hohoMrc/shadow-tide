<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>影潮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@400;500;900&display=swap">
<style>
  /* 主題：提燈人在黑夜原野上，被一波波影子包圍。只做深色主題：場景本身就是夜晚 */
  :root {
    --night: #0c0e19;      /* 頁面底色 */
    --panel: #171a2b;      /* 卡片底 */
    --line: rgba(255,255,255,.12);
    --ink: #ece8f5;        /* 主要文字 */
    --dim: #8f8aa8;        /* 次要文字 */
    --lamp: #ffc857;       /* 燈火的暖黃，唯一強調色 */
    --xp: #7be0ff;         /* 經驗光晶 */
    --hp: #ff5d73;
    --font-gauge: "Chakra Petch", "SF Mono", ui-monospace, monospace;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  /* 手機防放大、防選字（cave-copter 實測有效的組合） */
  html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #game {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; -webkit-tap-highlight-color: transparent;
  }

  /* ---- HUD ---- */
  .hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: max(10px, env(safe-area-inset-top)) 16px 0;
    pointer-events: none;
    display: flex; flex-direction: column; gap: 8px;
    max-width: 900px; margin: 0 auto;
  }
  .xpbar { height: 8px; background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden; }
  .xpbar > i { display: block; height: 100%; width: 0; background: var(--xp); transition: width .15s; }
  .stats { display: flex; align-items: center; gap: 16px; font-family: var(--font-gauge); font-size: 15px; }
  .stats .time { flex: 1; text-align: center; font-size: 20px; font-weight: 700; letter-spacing: .05em; }
  .stats small { color: var(--dim); font-family: var(--font-body); font-size: 12px; margin-right: 4px; }
  .pause-btn {
    pointer-events: auto;
    width: 36px; height: 36px; border-radius: 10px;
    border: 1px solid var(--line); background: rgba(23,26,43,.7); color: var(--ink);
    font-size: 14px; cursor: pointer;
  }

  /* ---- 覆蓋畫面（標題 / 升級 / 暫停 / 結束）---- */
  .overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(5,6,12,.72);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .card { width: 100%; max-width: 420px; text-align: center; }
  .card h1 { font-size: 3rem; font-weight: 900; letter-spacing: .2em; margin: 0 0 6px; color: var(--lamp); }
  .card h2 { font-size: 1.6rem; font-weight: 900; margin: 0 0 4px; letter-spacing: .08em; }
  .card p { color: var(--dim); line-height: 1.7; margin: 0 0 18px; }
  .btn {
    font: inherit; font-weight: 700; font-size: 1.05rem;
    padding: 12px 28px; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--lamp); color: #1a1405;
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .controls { font-size: .9rem; color: var(--dim); margin-top: 18px; line-height: 1.8; }
  .controls b { color: var(--ink); font-weight: 500; }

  .choices { display: grid; gap: 10px; margin-top: 14px; text-align: left; }
  .choice {
    font: inherit; color: var(--ink); text-align: left; cursor: pointer;
    display: grid; grid-template-columns: 44px 1fr; gap: 4px 12px; align-items: center;
    padding: 14px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line);
  }
  .choice:hover, .choice:focus-visible { border-color: var(--lamp); outline: none; }
  .choice .icon {
    grid-row: span 2; width: 44px; height: 44px; border-radius: 10px;
    display: grid; place-items: center; font-size: 22px; background: rgba(255,200,87,.12); color: var(--lamp);
  }
  .choice .name { font-weight: 700; }
  .choice .name em { font-style: normal; font-family: var(--font-gauge); color: var(--lamp); font-size: .85rem; margin-left: 6px; }
  .choice .desc { color: var(--dim); font-size: .88rem; }
  .choice .tag { font-size: .72rem; color: var(--xp); margin-left: 6px; }

  .result { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
  .result div { background: var(--panel); border-radius: 12px; padding: 10px 4px; }
  .result b { display: block; font-family: var(--font-gauge); font-size: 1.4rem; }
  .result span { color: var(--dim); font-size: .8rem; }
  .build { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 18px; }
  .build span { font-size: .85rem; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
  .build span em { font-style: normal; color: var(--lamp); font-family: var(--font-gauge); margin-left: 4px; }

  /* 進化動畫：舊武器 → 新武器 */
  .evo { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 18px 0 10px; }
  .evo span { display: grid; justify-items: center; gap: 6px; font-size: 40px; line-height: 1; }
  .evo small { font-size: .9rem; color: var(--dim); }
  .evo .to { color: var(--lamp); text-shadow: 0 0 18px rgba(255,200,87,.7); animation: evo-pop .6s ease-out; }
  .evo .to small { color: var(--lamp); font-weight: 700; }
  .evo .arrow { font-size: 24px; color: var(--dim); }
  @keyframes evo-pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
  .hint { font-size: .85rem; }

  .recipes { display: grid; gap: 6px; margin-bottom: 18px; font-size: .85rem; }
  .recipes div { display: flex; justify-content: center; gap: 6px; align-items: center; color: var(--dim); }
  .recipes .ok { color: var(--ink); }
  .recipes .ok::after { content: '✓'; color: var(--lamp); }
  .recipes .done { color: var(--lamp); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud" id="hud" hidden>
  <div class="xpbar"><i id="xpFill"></i></div>
  <div class="stats">
    <span><small>等級</small><b id="lvl">1</b></span>
    <span class="time" id="time">00:00</span>
    <span><small>擊殺</small><b id="kills">0</b></span>
    <button class="pause-btn" id="muteBtn" aria-label="靜音">🔊</button>
    <button class="pause-btn" id="pauseBtn" aria-label="暫停">❚❚</button>
  </div>
</div>

<div class="overlay" id="titleScreen">
  <div class="card">
    <h1>影潮</h1>
    <p>提著燈，撐過黑夜裡湧來的影子。<br>撐到 10:00，天就亮了。</p>
    <button class="btn" id="startBtn">點燈出發</button>
    <div class="controls">
      <b>電腦</b>　WASD／方向鍵移動，P 暫停<br>
      <b>手機</b>　按住畫面任一處拖曳移動<br>
      攻擊全自動 · 撿光晶升級 · 三選一打造流派
    </div>
  </div>
</div>

<div class="overlay" id="levelScreen" hidden>
  <div class="card">
    <h2>升級！</h2>
    <p style="margin:0">選一項強化</p>
    <div class="choices" id="choices"></div>
  </div>
</div>

<div class="overlay" id="chestScreen" hidden>
  <div class="card">
    <h2 id="chestTitle">寶箱</h2>
    <div id="chestBody"></div>
    <button class="btn" id="chestBtn">收下</button>
  </div>
</div>

<div class="overlay" id="pauseScreen" hidden>
  <div class="card">
    <h2>暫停</h2>
    <p>目前的流派</p>
    <div class="build" id="pauseBuild"></div>
    <p style="margin-bottom:8px">進化配方</p>
    <div class="recipes" id="recipes"></div>
    <div class="btns">
      <button class="btn" id="resumeBtn">繼續</button>
      <button class="btn ghost" id="quitBtn">重新開始</button>
    </div>
  </div>
</div>

<div class="overlay" id="overScreen" hidden>
  <div class="card">
    <h2 id="overTitle">燈熄了</h2>
    <p id="overSub"></p>
    <div class="result">
      <div><b id="rTime">00:00</b><span>存活時間</span></div>
      <div><b id="rLvl">1</b><span>等級</span></div>
      <div><b id="rKills">0</b><span>擊殺</span></div>
    </div>
    <div class="build" id="overBuild"></div>
    <button class="btn" id="againBtn">再來一局</button>
  </div>
</div>

<script>
'use strict';
// ============================================================
//  基本工具
// ============================================================
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

const WIN_TIME = 600;      // 撐到 10 分鐘獲勝
const MAX_ENEMIES = 500;   // 同時存在的敵人上限，保護手機效能（模擬測過 500 隻仍很輕）

const canvas = $('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, zoom = 1;
let hudBottom = 0;   // HUD 底部的位置（含瀏海安全區），連殺數字排在它下面

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 讓手機和電腦看到的「世界範圍」差不多：短邊大約看到 640 單位
  zoom = clamp(Math.min(W, H) / 640, 0.6, 1.4);
  hudBottom = 0;
}
addEventListener('resize', resize);
resize();

// ============================================================
//  輸入：鍵盤 + 浮動搖桿（手指按哪裡，搖桿中心就在哪裡）
// ============================================================
const keys = new Set();
addEventListener('keydown', e => {
  keys.add(e.key.toLowerCase());
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
  if (game.mode === 'levelup' && ['1', '2', '3'].includes(e.key)) {
    const btn = $('choices').children[Number(e.key) - 1];
    if (btn) btn.click();
  }
  if (game.mode === 'chest' && (e.key === 'Enter' || e.key === ' ')) $('chestBtn').click();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

const stick = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
const STICK_R = 50;
canvas.addEventListener('pointerdown', e => {
  if (stick.id !== null) return;
  stick.id = e.pointerId;
  stick.ox = stick.x = e.clientX;
  stick.oy = stick.y = e.clientY;
});
addEventListener('pointermove', e => {
  if (e.pointerId !== stick.id) return;
  stick.x = e.clientX; stick.y = e.clientY;
});
const releaseStick = e => { if (e.pointerId === stick.id) stick.id = null; };
addEventListener('pointerup', releaseStick);
addEventListener('pointercancel', releaseStick);
// iOS：擋掉雙指縮放與連點放大
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

function readMove() {
  let x = 0, y = 0;
  if (keys.has('a') || keys.has('arrowleft')) x -= 1;
  if (keys.has('d') || keys.has('arrowright')) x += 1;
  if (keys.has('w') || keys.has('arrowup')) y -= 1;
  if (keys.has('s') || keys.has('arrowdown')) y += 1;
  if (stick.id !== null) {
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    const d = Math.hypot(dx, dy);
    if (d > 6) { const k = Math.min(d, STICK_R) / STICK_R / d; x = dx * k; y = dy * k; }
  }
  const len = Math.hypot(x, y);
  return len > 1 ? { x: x / len, y: y / len } : { x, y };
}

// ============================================================
//  音效：用 Web Audio 即時合成，不需要音檔
// ============================================================
const sfx = (() => {
  let ac = null, master = null, muted = false;
  try { muted = localStorage.getItem('shadowtide-mute') === '1'; } catch (_) {}
  const VOL = 0.3;
  const lastAt = {};
  // 必須在使用者點擊時建立（瀏覽器規定），所以在開始遊戲時呼叫
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = muted ? 0 : VOL;
    master.connect(ac.destination);
  }
  // 同一種音效限制頻率：幾百隻怪同時死也不會爆音
  function ok(name, gapMs) {
    const t = performance.now();
    if (t - (lastAt[name] || 0) < gapMs) return false;
    lastAt[name] = t;
    return true;
  }
  function tone(f0, f1, dur, type = 'sine', vol = 0.5, delay = 0) {
    if (!ac || muted) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const arp = (notes, step, dur) => notes.forEach((f, i) => tone(f, f, dur, 'triangle', 0.28, i * step));
  return {
    init,
    get muted() { return muted; },
    toggle() {
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : VOL;
      try { localStorage.setItem('shadowtide-mute', muted ? '1' : '0'); } catch (_) {}
      return muted;
    },
    hit()   { if (ok('hit', 45)) tone(rand(850, 1000), 500, 0.035, 'square', 0.06); },
    kill()  { if (ok('kill', 28)) tone(rand(480, 720), 110, 0.09, 'triangle', 0.25); },
    // 連續撿光晶，音調一個半音一個半音往上爬
    gem(n)  { if (ok('gem', 32)) { const f = 620 * 2 ** (Math.min(n, 24) / 12); tone(f, f * 1.01, 0.07, 'sine', 0.14); } },
    pulse() { tone(240, 55, 0.28, 'sine', 0.35); },
    hurt()  { tone(170, 45, 0.2, 'sawtooth', 0.3); },
    elite() { tone(320, 35, 0.6, 'sawtooth', 0.35); },
    levelUp() { arp([523, 659, 784, 1047], 0.06, 0.15); },
    chest()   { arp([392, 523, 659, 784, 1047, 1319], 0.055, 0.2); },
  };
})();

// ============================================================
//  空間格子：把敵人依位置分格，碰撞時只檢查附近的格子
//  （350 隻敵人兩兩比對要 6 萬次，分格後只剩幾百次）
// ============================================================
const CELL = 64;
const grid = new Map();
const gkey = (cx, cy) => (cx + 50000) * 100000 + (cy + 50000);
function buildGrid() {
  grid.clear();
  for (const e of game.enemies) {
    const k = gkey(Math.floor(e.x / CELL), Math.floor(e.y / CELL));
    let cell = grid.get(k);
    if (!cell) grid.set(k, cell = []);
    cell.push(e);
  }
}
// 對 (x,y) 半徑 r 範圍內「可能」碰到的敵人執行 fn；fn 回傳 true 可提前結束
function forNear(x, y, r, fn) {
  const x0 = Math.floor((x - r) / CELL), x1 = Math.floor((x + r) / CELL);
  const y0 = Math.floor((y - r) / CELL), y1 = Math.floor((y + r) / CELL);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
    const cell = grid.get(gkey(cx, cy));
    if (cell) for (const e of cell) if (!e.dead && fn(e)) return;
  }
}

// ============================================================
//  武器與被動：升級選項的資料都在這裡，加新技能只要加一筆
// ============================================================
// 同一種攻擊方式（kind）共用一段行為程式，進化版只是數值和外觀不同
const WEAPONS = {
  bolt: {
    name: '星光彈', icon: '✦', max: 6, kind: 'shoot',
    blurb: '自動射向最近的敵人',
    stat: lv => ({ cd: 1.0 - 0.1 * (lv - 1), dmg: 10 + 4 * (lv - 1), count: 1 + Math.floor((lv - 1) / 2), pierce: lv >= 6 ? 3 : lv >= 4 ? 2 : 1,
                   speed: 430, r: 5, spread: 0.16, color: '#fff3c4' }),
    desc: s => `傷害 ${s.dmg} · 每 ${s.cd.toFixed(1)} 秒 ${s.count} 發 · 貫穿 ${s.pierce}`,
  },
  orbit: {
    name: '守夜燈', icon: '◉', max: 5, kind: 'orbit',
    blurb: '燈火繞著你旋轉，燒傷碰到的影子',
    stat: lv => ({ count: lv + 1, dmg: 8 + 3 * (lv - 1), radius: 62 + 6 * lv, size: 8, spin: 3.2, hitCd: 0.45 }),
    desc: s => `${s.count} 顆燈火 · 傷害 ${s.dmg}`,
  },
  pulse: {
    name: '震光環', icon: '◎', max: 5, kind: 'pulse',
    blurb: '定期爆出光環，擊退周圍所有敵人',
    stat: lv => ({ cd: 3.2 - 0.3 * (lv - 1), dmg: 16 + 6 * (lv - 1), radius: 100 + 15 * (lv - 1), stun: 0, color: '255,200,87' }),
    desc: s => `傷害 ${s.dmg} · 範圍 ${s.radius} · 每 ${s.cd.toFixed(1)} 秒`,
  },

  // ---- 進化武器：只能從寶箱得到，不會出現在升級選項裡 ----
  nova: {
    name: '星河', icon: '✸', max: 1, kind: 'shoot', evolved: true,
    blurb: '光彈化成星河，高速連射、無限貫穿',
    stat: () => ({ cd: 0.28, dmg: 30, count: 2, pierce: Infinity, speed: 560, r: 7, spread: 0.08, color: '#ffc857' }),
  },
  crown: {
    name: '烈日冠', icon: '☀', max: 1, kind: 'orbit', evolved: true,
    blurb: '8 顆烈日環繞，軌道一縮一放',
    // 半徑隨時間呼吸，近身和外圈都掃得到
    stat: () => ({ count: 8, dmg: 28, radius: 105 + 40 * Math.sin(game.t * 2), size: 13, spin: 4.2, hitCd: 0.3 }),
  },
  dawn: {
    name: '破曉', icon: '✺', max: 1, kind: 'pulse', evolved: true,
    blurb: '黎明的光爆，大範圍重擊並讓影子暈眩',
    stat: () => ({ cd: 1.6, dmg: 60, radius: 220, stun: 0.8, color: '255,244,214' }),
  },
};

// 進化配方：武器滿級 + 擁有對應被動 → 撿到寶箱時進化
const EVOLUTIONS = [
  { from: 'bolt',  need: 'focus', into: 'nova' },
  { from: 'orbit', need: 'vigor', into: 'crown' },
  { from: 'pulse', need: 'might', into: 'dawn' },
];

const PASSIVES = {
  vigor:  { name: '強韌', icon: '♥', max: 5, desc: '最大生命 +20，並回復 20', apply: p => { p.maxHp += 20; p.hp = Math.min(p.maxHp, p.hp + 20); } },
  swift:  { name: '疾行', icon: '»', max: 5, desc: '移動速度 +10%', apply: p => { p.moveMul += 0.1; } },
  magnet: { name: '磁石', icon: '∪', max: 5, desc: '拾取範圍 +35%', apply: p => { p.pickup *= 1.35; } },
  might:  { name: '力量', icon: '▲', max: 5, desc: '所有傷害 +12%', apply: p => { p.dmgMul += 0.12; } },
  focus:  { name: '專注', icon: '◷', max: 5, desc: '攻擊冷卻 -8%', apply: p => { p.cdMul *= 0.92; } },
  regen:  { name: '再生', icon: '✚', max: 5, desc: '每秒回復 0.6 生命', apply: p => { p.regen += 0.6; } },
};
const MAX_WEAPONS = 4;

// ============================================================
//  敵人種類
// ============================================================
const ENEMY_TYPES = {
  wisp:   { r: 11, hp: 7,   speed: 72,  dmg: 8,  xp: 1,  color: '#5b4f8c' },
  runner: { r: 9,  hp: 6,   speed: 125, dmg: 6,  xp: 1,  color: '#3f7a8c' },
  brute:  { r: 19, hp: 55,  speed: 46,  dmg: 15, xp: 3,  color: '#7a3f63' },
  elite:  { r: 30, hp: 450, speed: 52,  dmg: 25, xp: 25, color: '#a8324f', elite: true },
};

// ============================================================
//  遊戲狀態
// ============================================================
const game = { mode: 'title' };

function newGame() {
  Object.assign(game, {
    mode: 'play', t: 0, kills: 0, shake: 0,
    spawnAcc: 0, nextElite: 60, nextRing: 90,
    pendingLevels: 0, pendingChests: 0, starterChest: false,
    enemies: [], bullets: [], gems: [], rings: [], particles: [], texts: [], pops: [],
    combo: 0, comboT: 0, bestCombo: 0, gemCombo: 0, gemT: 0,
    weapons: [], passives: {},
  });
  // 網址加 ?debug：一開始就有滿級武器和配方被動，5 秒出菁英，方便測試進化
  sfx.init();
  const debug = location.search.includes('debug');
  if (debug) game.nextElite = 5;
  game.player = {
    x: 0, y: 0, r: 14, hp: 100, maxHp: 100, iframe: 0,
    speed: 150, moveMul: 1, dmgMul: 1, cdMul: 1, pickup: 70, regen: 0,
    lvl: 1, xp: 0, xpNext: xpNeed(1), faceX: 1, faceY: 0,
  };
  addWeapon('bolt');
  // 開局送一個寶箱（必定是新武器），放在角色上方，走幾步就撿得到
  game.gems.push({ x: 0, y: -150, v: 0, kind: 'chest', starter: true, magnet: false });
  if (debug) {
    for (const id of ['bolt', 'orbit', 'pulse']) while ((game.weapons.find(w => w.id === id)?.lv || 0) < WEAPONS[id].max) addWeapon(id);
    for (const id of ['focus', 'vigor', 'might']) { game.passives[id] = 1; PASSIVES[id].apply(game.player); }
  }
  showOnly(null);
  $('hud').hidden = false;
}

// 怪變多之後經驗也多，需求跟著拉高，讓整局大約升到 40 級左右
const xpNeed = lvl => Math.floor(5 + lvl * 6 + lvl * lvl * 0.6);

function addWeapon(id) {
  const w = game.weapons.find(w => w.id === id);
  if (w) w.lv++;
  else game.weapons.push({ id, lv: 1, timer: 0.3, angle: 0, orbs: [] });
}

// ============================================================
//  主迴圈
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);   // 切回分頁時不要一次跳太多
  last = now;
  if (game.mode === 'play') update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function update(dt) {
  const P = game.player;
  game.t += dt;

  // --- 玩家移動 ---
  const mv = readMove();
  P.x += mv.x * P.speed * P.moveMul * dt;
  P.y += mv.y * P.speed * P.moveMul * dt;
  if (mv.x || mv.y) { P.faceX = mv.x; P.faceY = mv.y; }
  P.iframe -= dt;
  P.hp = Math.min(P.maxHp, P.hp + P.regen * dt);

  spawnEnemies(dt);
  buildGrid();
  updateEnemies(dt);
  for (const w of game.weapons) WEAPON_UPDATE[WEAPONS[w.id].kind](w, dt, WEAPONS[w.id].stat(w.lv));
  updateBullets(dt);
  updateGems(dt);
  updateFx(dt);

  game.enemies = game.enemies.filter(e => !e.dead);
  game.shake = Math.max(0, game.shake - dt * 30);

  if (P.hp <= 0) return endGame(false);
  if (game.t >= WIN_TIME) return endGame(true);
  // 寶箱優先：先進化，接下來的升級選項才會反映新武器
  if (game.pendingChests > 0) openChest();
  else if (game.pendingLevels > 0) openLevelUp();
  updateHud();
}

// ============================================================
//  生怪：隨時間越來越快、越來越硬
// ============================================================
const viewRadius = () => Math.hypot(W, H) / 2 / zoom;

function spawnEnemies(dt) {
  const t = game.t;
  // 成群出現：同一個方向一次湧來一小團，掃過去才有「割草」的感覺
  game.spawnAcc += dt * Math.min(3 + t / 8, 45);
  const group = 3 + Math.floor(Math.random() * (3 + t / 60));
  if (game.spawnAcc >= group) {
    game.spawnAcc -= group;
    const a = Math.random() * Math.PI * 2, d = viewRadius() + 40;
    const cx = game.player.x + Math.cos(a) * d, cy = game.player.y + Math.sin(a) * d;
    const type = pickType();
    for (let i = 0; i < group; i++) spawnEnemy(type, cx + rand(-40, 40), cy + rand(-40, 40));
  }
  // 每分鐘一隻菁英
  if (t >= game.nextElite) { game.nextElite += 60; spawnEnemy('elite'); }
  // 每 90 秒一次「包圍」：一圈影子同時出現
  if (t >= game.nextRing) {
    game.nextRing += 90;
    const n = 36, R = viewRadius() * 0.85;
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      spawnEnemy('wisp', game.player.x + Math.cos(a) * R, game.player.y + Math.sin(a) * R, true);
    }
  }
}

function pickType() {
  const t = game.t;
  const table = [['wisp', 1], ['runner', t > 60 ? 0.35 : 0], ['brute', t > 30 ? 0.2 + t / 600 : 0]];
  let roll = Math.random() * table.reduce((s, [, w]) => s + w, 0);
  for (const [id, w] of table) if ((roll -= w) < 0) return id;
  return 'wisp';
}

function spawnEnemy(type, x, y, force) {
  if (!force && game.enemies.length >= MAX_ENEMIES) return;
  const T = ENEMY_TYPES[type];
  if (x === undefined) {
    const a = Math.random() * Math.PI * 2, d = viewRadius() + 40;
    x = game.player.x + Math.cos(a) * d;
    y = game.player.y + Math.sin(a) * d;
  }
  const hp = T.hp * (1 + game.t / 120);  // 血量隨時間成長（成長慢一點，小怪才能維持一兩下就倒）
  game.enemies.push({ ...T, type, x, y, hp, maxHp: hp, vx: 0, vy: 0, flash: 0, orbitCd: 0, stun: 0, dead: false });
}

function updateEnemies(dt) {
  const P = game.player;
  const far = viewRadius() * 2;
  for (const e of game.enemies) {
    let dx = P.x - e.x, dy = P.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    // 跑太遠的敵人搬回畫面邊緣，不然玩家一直跑就甩掉了
    if (d > far) {
      const a = Math.random() * Math.PI * 2, r = viewRadius() + 40;
      e.x = P.x + Math.cos(a) * r; e.y = P.y + Math.sin(a) * r;
      continue;
    }
    // 暈眩中不會追玩家，但仍會被擊退
    const chase = e.stun > 0 ? 0 : e.speed;
    e.stun -= dt;
    e.x += (dx / d * chase + e.vx) * dt;
    e.y += (dy / d * chase + e.vy) * dt;
    // 擊退速度逐漸衰減
    const decay = Math.min(1, 8 * dt);
    e.vx -= e.vx * decay; e.vy -= e.vy * decay;
    e.flash -= dt;

    // 互相推開，避免全部疊成一團
    forNear(e.x, e.y, e.r * 2, o => {
      if (o === e) return;
      const ox = e.x - o.x, oy = e.y - o.y, min = e.r + o.r;
      const dd = ox * ox + oy * oy;
      if (dd > 0.01 && dd < min * min) {
        const dist = Math.sqrt(dd), push = (min - dist) * 0.25;
        e.x += ox / dist * push; e.y += oy / dist * push;
      }
    });

    // 碰到玩家
    if (d < e.r + P.r && P.iframe <= 0) {
      P.hp -= e.dmg;
      P.iframe = 0.5;
      game.shake = 8;
      sfx.hurt();
      addText(P.x, P.y - 24, e.dmg, '#ff5d73');
    }
  }
}

function hurt(e, dmg, kx = 0, ky = 0) {
  if (e.dead) return;
  e.hp -= dmg;
  e.flash = 0.08;
  // 菁英比較難推
  const kb = e.elite ? 0.2 : 1;
  e.vx += kx * kb; e.vy += ky * kb;
  addText(e.x, e.y - e.r, Math.round(dmg), '#fff');
  if (e.hp <= 0) {
    e.dead = true;
    game.kills++;
    game.combo++; game.comboT = 0;
    game.bestCombo = Math.max(game.bestCombo, game.combo);
    burst(e.x, e.y, e.color, e.elite ? 40 : 10);
    if (game.pops.length < 80) game.pops.push({ x: e.x, y: e.y, r: e.r, age: 0 });
    if (e.elite) { sfx.elite(); game.shake = 10; } else sfx.kill();
    game.gems.push({ x: e.x, y: e.y, v: e.xp, kind: 'xp', magnet: false });
    if (e.elite) {
      game.gems.push({ x: e.x + 14, y: e.y, v: 30, kind: 'heal', magnet: false });
      game.gems.push({ x: e.x - 14, y: e.y, v: 0, kind: 'chest', magnet: false });
    }
  } else sfx.hit();
}

// ============================================================
//  武器行為
// ============================================================
function nearestEnemy(x, y, maxD) {
  let best = null, bd = maxD * maxD;
  for (const e of game.enemies) {
    if (e.dead) continue;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

// 依攻擊方式分三種行為，s 是該武器目前等級的數值
const WEAPON_UPDATE = {
  shoot(w, dt, s) {
    w.timer -= dt;
    if (w.timer > 0) return;
    const P = game.player;
    const target = nearestEnemy(P.x, P.y, 520);
    if (!target) { w.timer = 0.1; return; }
    const base = Math.atan2(target.y - P.y, target.x - P.x);
    for (let i = 0; i < s.count; i++) {
      const a = base + (i - (s.count - 1) / 2) * s.spread;
      game.bullets.push({
        x: P.x, y: P.y, vx: Math.cos(a) * s.speed, vy: Math.sin(a) * s.speed,
        r: s.r, color: s.color, dmg: s.dmg * P.dmgMul, pierce: s.pierce, life: 1.3, hit: new Set(),
      });
    }
    w.timer = s.cd * P.cdMul;
  },

  orbit(w, dt, s) {
    const P = game.player;
    w.angle += s.spin * dt;
    w.size = s.size;
    w.orbs = [];
    for (let i = 0; i < s.count; i++) {
      const a = w.angle + i / s.count * Math.PI * 2;
      const ox = P.x + Math.cos(a) * s.radius, oy = P.y + Math.sin(a) * s.radius;
      w.orbs.push({ x: ox, y: oy });
      forNear(ox, oy, s.size + 32, e => {
        if (e.orbitCd > game.t) return;          // 同一隻敵人一段時間內只吃一次
        if (Math.hypot(e.x - ox, e.y - oy) < e.r + s.size + 2) {
          const d = Math.hypot(e.x - P.x, e.y - P.y) || 1;
          hurt(e, s.dmg * P.dmgMul, (e.x - P.x) / d * 120, (e.y - P.y) / d * 120);
          e.orbitCd = game.t + s.hitCd;
        }
      });
    }
  },

  pulse(w, dt, s) {
    w.timer -= dt;
    if (w.timer > 0) return;
    const P = game.player;
    game.rings.push({ x: P.x, y: P.y, max: s.radius, life: 0.35, age: 0, color: s.color });
    sfx.pulse();
    forNear(P.x, P.y, s.radius + 30, e => {
      const dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy) || 1;
      if (d < s.radius + e.r) {
        hurt(e, s.dmg * P.dmgMul, dx / d * 320, dy / d * 320);
        if (s.stun) e.stun = e.elite ? s.stun / 3 : s.stun;
      }
    });
    w.timer = s.cd * P.cdMul;
  },
};

function updateBullets(dt) {
  for (const b of game.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    forNear(b.x, b.y, b.r + 30, e => {
      if (b.hit.has(e)) return;
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.r) {
        hurt(e, b.dmg, b.vx * 0.15, b.vy * 0.15);
        b.hit.add(e);
        if (--b.pierce <= 0) { b.life = 0; return true; }
      }
    });
  }
  game.bullets = game.bullets.filter(b => b.life > 0);
}

// ============================================================
//  光晶（經驗）與升級
// ============================================================
function updateGems(dt) {
  const P = game.player;
  // 地上光晶太多時合併，避免越積越卡
  // （只合併經驗光晶，寶箱和回血不能被併掉）
  if (game.gems.length > 400) {
    const i = game.gems.findIndex(g => g.kind === 'xp');
    const j = game.gems.findIndex((g, k) => k !== i && g.kind === 'xp');
    if (i >= 0 && j >= 0) { game.gems[j].v += game.gems[i].v; game.gems.splice(i, 1); }
  }
  for (const g of game.gems) {
    const dx = P.x - g.x, dy = P.y - g.y, d = Math.hypot(dx, dy) || 1;
    if (d < P.pickup) g.magnet = true;
    if (g.magnet) {
      const sp = 480 * dt;
      g.x += dx / d * sp; g.y += dy / d * sp;
    }
    if (d < P.r + 8) {
      g.taken = true;
      if (g.kind === 'heal') {
        P.hp = Math.min(P.maxHp, P.hp + g.v);
        addText(P.x, P.y - 24, '+' + g.v, '#7dff9b');
      } else if (g.kind === 'chest') {
        game.pendingChests++;
        if (g.starter) game.starterChest = true;
      }
      else {
        gainXp(g.v);
        game.gemCombo = game.gemT < 0.6 ? game.gemCombo + 1 : 0;
        game.gemT = 0;
        sfx.gem(game.gemCombo);
      }
    }
  }
  game.gems = game.gems.filter(g => !g.taken);
}

function gainXp(v) {
  const P = game.player;
  P.xp += v;
  while (P.xp >= P.xpNext) {
    P.xp -= P.xpNext;
    P.lvl++;
    P.xpNext = xpNeed(P.lvl);
    game.pendingLevels++;
  }
}

// 隨機抽 3 個可選的強化（洗牌後取前 3）
function rollChoices() {
  const pool = [];
  for (const [id, W_] of Object.entries(WEAPONS)) {
    if (W_.evolved) continue;
    // 已經進化掉的武器，不能再當新武器拿一次
    const evolvedInto = EVOLUTIONS.find(r => r.from === id)?.into;
    if (evolvedInto && game.weapons.some(w => w.id === evolvedInto)) continue;
    const owned = game.weapons.find(w => w.id === id);
    if (owned && owned.lv < W_.max) pool.push({ kind: 'weapon', id, lv: owned.lv + 1 });
    if (!owned && game.weapons.length < MAX_WEAPONS) pool.push({ kind: 'weapon', id, lv: 1 });
  }
  for (const [id, P_] of Object.entries(PASSIVES)) {
    const lv = game.passives[id] || 0;
    if (lv < P_.max) pool.push({ kind: 'passive', id, lv: lv + 1 });
  }
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const picks = pool.slice(0, 3);
  if (!picks.length) picks.push({ kind: 'heal' });   // 全部滿級時的保底
  return picks;
}

let levelOpenedAt = 0;
function openLevelUp() {
  game.mode = 'levelup';
  game.pendingLevels--;
  sfx.levelUp();
  levelOpenedAt = performance.now();
  stick.id = null;
  const box = $('choices');
  box.innerHTML = '';
  for (const c of rollChoices()) {
    let icon, name, desc, tag = '';
    if (c.kind === 'weapon') {
      const D = WEAPONS[c.id];
      icon = D.icon; name = D.name;
      desc = c.lv === 1 ? `${D.blurb}　${D.desc(D.stat(1))}` : D.desc(D.stat(c.lv));
      tag = c.lv === 1 ? '新武器' : c.lv === D.max ? '滿級' : '';
      const evo = EVOLUTIONS.find(r => r.from === c.id);
      if (evo && c.lv === D.max) {
        desc += game.passives[evo.need]
          ? `<br>✓ 已有「${PASSIVES[evo.need].name}」，打倒菁英撿寶箱即可進化`
          : `<br>搭配「${PASSIVES[evo.need].name}」可進化成「${WEAPONS[evo.into].name}」`;
      }
    } else if (c.kind === 'passive') {
      const D = PASSIVES[c.id];
      icon = D.icon; name = D.name; desc = D.desc;
      // 是手上某把武器的進化素材，而且還沒拿過，就標出來
      const evo = EVOLUTIONS.find(r => r.need === c.id && game.weapons.some(w => w.id === r.from));
      if (evo && c.lv === 1) {
        tag = '進化素材';
        desc += `<br>${WEAPONS[evo.from].name}滿級後可進化成「${WEAPONS[evo.into].name}」`;
      }
    } else {
      icon = '✚'; name = '燈油'; desc = '回復 40 生命';
    }
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = `<span class="icon">${icon}</span>
      <span class="name">${name}${c.lv ? `<em>Lv.${c.lv}</em>` : ''}${tag ? `<span class="tag">${tag}</span>` : ''}</span>
      <span class="desc">${desc}</span>`;
    btn.onclick = () => {
      if (performance.now() - levelOpenedAt < 250) return;   // 防止升級瞬間手指剛好點到
      applyChoice(c);
    };
    box.appendChild(btn);
  }
  showOnly('levelScreen');
}

function applyChoice(c) {
  const P = game.player;
  if (c.kind === 'weapon') addWeapon(c.id);
  else if (c.kind === 'passive') {
    game.passives[c.id] = (game.passives[c.id] || 0) + 1;
    PASSIVES[c.id].apply(P);
  } else P.hp = Math.min(P.maxHp, P.hp + 40);
  continueQueue();
}

// 依序處理還沒打開的寶箱和升級，都處理完才回到遊戲
function continueQueue() {
  if (game.pendingChests > 0) openChest();
  else if (game.pendingLevels > 0) openLevelUp();
  else { game.mode = 'play'; last = performance.now(); showOnly(null); }
}

// ============================================================
//  寶箱：有符合條件的武器就進化，沒有就送一次免費升級
// ============================================================
const evolvable = () => EVOLUTIONS.filter(r => {
  const w = game.weapons.find(w => w.id === r.from);
  return w && w.lv >= WEAPONS[r.from].max && game.passives[r.need];
});

function openChest() {
  game.mode = 'chest';
  game.pendingChests--;
  sfx.chest();
  levelOpenedAt = performance.now();
  stick.id = null;
  const ready = evolvable();
  let html;
  // 開局寶箱：從還沒擁有的武器裡抽一把
  const starter = game.starterChest;
  game.starterChest = false;
  const fresh = Object.keys(WEAPONS).filter(id => !WEAPONS[id].evolved
    && !game.weapons.some(w => w.id === id || w.id === EVOLUTIONS.find(r => r.from === id)?.into));
  if (starter && fresh.length) {
    const id = fresh[Math.floor(Math.random() * fresh.length)];
    addWeapon(id);
    const D = WEAPONS[id];
    $('chestTitle').textContent = '新武器！';
    html = `<div class="evo"><span class="to">${D.icon}<small>${D.name}</small></span></div><p>${D.blurb}</p>`;
  } else if (ready.length) {
    const r = ready[Math.floor(Math.random() * ready.length)];
    const w = game.weapons.find(w => w.id === r.from);
    // 直接把武器換成進化版，保留原本的計時與角度，攻擊不會中斷
    w.id = r.into; w.lv = 1;
    const F = WEAPONS[r.from], T = WEAPONS[r.into];
    $('chestTitle').textContent = '進化！';
    html = `<div class="evo">
      <span class="from">${F.icon}<small>${F.name}</small></span>
      <span class="arrow">→</span>
      <span class="to">${T.icon}<small>${T.name}</small></span>
    </div><p>${T.blurb}</p>`;
    burst(game.player.x, game.player.y, '#ffc857', 40);
  } else {
    // 沒有能進化的：從升級選項裡隨機送一個
    const c = rollChoices()[0];
    const P = game.player;
    let label;
    if (c.kind === 'weapon') { addWeapon(c.id); label = `${WEAPONS[c.id].icon} ${WEAPONS[c.id].name} Lv.${c.lv}`; }
    else if (c.kind === 'passive') {
      game.passives[c.id] = (game.passives[c.id] || 0) + 1;
      PASSIVES[c.id].apply(P);
      label = `${PASSIVES[c.id].icon} ${PASSIVES[c.id].name} Lv.${c.lv}`;
    } else { P.hp = Math.min(P.maxHp, P.hp + 40); label = '✚ 回復 40 生命'; }
    $('chestTitle').textContent = '寶箱';
    html = `<p>獲得 <b style="color:var(--lamp)">${label}</b></p>
      <p class="hint">提示：武器滿級，再加上對應的被動，寶箱就會讓它進化</p>`;
  }
  $('chestBody').innerHTML = html;
  showOnly('chestScreen');
}

$('chestBtn').onclick = () => {
  if (performance.now() - levelOpenedAt < 250) return;
  continueQueue();
};

// ============================================================
//  特效
// ============================================================
function addText(x, y, txt, color) {
  if (game.texts.length > 60) game.texts.shift();
  game.texts.push({ x: x + rand(-6, 6), y, txt, color, life: 0.6 });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n && game.particles.length < 600; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(60, 220);
    game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.55), size: rand(2.5, 6), color });
  }
}
function updateFx(dt) {
  for (const p of game.particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    p.vx *= 1 - 4 * dt; p.vy *= 1 - 4 * dt;   // 噴出去後很快減速，看起來比較有爆開的感覺
  }
  for (const p of game.pops) p.age += dt;
  game.pops = game.pops.filter(p => p.age < 0.22);
  game.comboT += dt; game.gemT += dt;
  if (game.comboT > 1.5) game.combo = 0;
  for (const t of game.texts) { t.y -= 40 * dt; t.life -= dt; }
  for (const r of game.rings) r.age += dt;
  game.particles = game.particles.filter(p => p.life > 0);
  game.texts = game.texts.filter(t => t.life > 0);
  game.rings = game.rings.filter(r => r.age < r.life);
}

// ============================================================
//  繪圖
// ============================================================
function render() {
  ctx.fillStyle = '#0c0e19';
  ctx.fillRect(0, 0, W, H);
  if (!game.player) return;
  const P = game.player;

  ctx.save();
  const sx = game.shake ? rand(-game.shake, game.shake) : 0;
  const sy = game.shake ? rand(-game.shake, game.shake) : 0;
  ctx.translate(W / 2 + sx, H / 2 + sy);
  ctx.scale(zoom, zoom);
  ctx.translate(-P.x, -P.y);

  drawGround(P);

  // 光晶
  for (const g of game.gems) {
    if (g.kind === 'chest') {
      // 寶箱：金色方塊＋一閃一閃的光暈
      const glow = 0.35 + 0.25 * Math.sin(game.t * 6);
      ctx.fillStyle = `rgba(255,200,87,${glow})`;
      ctx.beginPath(); ctx.arc(g.x, g.y, 22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8a5a1c'; ctx.fillRect(g.x - 11, g.y - 8, 22, 16);
      ctx.fillStyle = '#ffc857'; ctx.fillRect(g.x - 11, g.y - 2, 22, 3); ctx.fillRect(g.x - 2, g.y - 8, 4, 16);
      continue;
    }
    const s = g.kind === 'heal' ? 8 : g.v >= 10 ? 7 : g.v >= 3 ? 5.5 : 4.5;
    ctx.fillStyle = g.kind === 'heal' ? '#7dff9b' : g.v >= 10 ? '#c58bff' : g.v >= 3 ? '#8dffb0' : '#7be0ff';
    ctx.beginPath();
    ctx.moveTo(g.x, g.y - s); ctx.lineTo(g.x + s * 0.7, g.y);
    ctx.lineTo(g.x, g.y + s); ctx.lineTo(g.x - s * 0.7, g.y);
    ctx.fill();
  }

  // 敵人：影子身體 + 一對發光眼睛看著玩家
  for (const e of game.enemies) {
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.color;
    const swell = e.flash > 0 ? 1.25 : 1;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * swell, 0, Math.PI * 2); ctx.fill();
    const a = Math.atan2(P.y - e.y, P.x - e.x);
    const ex = Math.cos(a) * e.r * 0.35, ey = Math.sin(a) * e.r * 0.35;
    const px = -Math.sin(a) * e.r * 0.3, py = Math.cos(a) * e.r * 0.3;
    // 暈眩時眼睛變暗
    ctx.fillStyle = e.stun > 0 ? '#6a6680' : e.elite ? '#ffdd55' : '#ff8fa3';
    const er = Math.max(1.6, e.r * 0.12);
    ctx.beginPath();
    ctx.arc(e.x + ex + px, e.y + ey + py, er, 0, Math.PI * 2);
    ctx.arc(e.x + ex - px, e.y + ey - py, er, 0, Math.PI * 2);
    ctx.fill();
    if (e.elite) {   // 菁英頭上血條
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(e.x - 26, e.y - e.r - 12, 52, 5);
      ctx.fillStyle = '#ff5d73'; ctx.fillRect(e.x - 26, e.y - e.r - 12, 52 * Math.max(0, e.hp / e.maxHp), 5);
    }
  }

  // 震光環
  for (const r of game.rings) {
    const k = r.age / r.life;
    ctx.strokeStyle = `rgba(${r.color},${1 - k})`;
    ctx.lineWidth = 6 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.max * (0.3 + 0.7 * k), 0, Math.PI * 2); ctx.stroke();
  }

  // 守夜燈 / 烈日冠
  for (const w of game.weapons) if (WEAPONS[w.id].kind === 'orbit') for (const o of w.orbs) {
    ctx.fillStyle = 'rgba(255,200,87,.25)';
    ctx.beginPath(); ctx.arc(o.x, o.y, w.size * 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = WEAPONS[w.id].evolved ? '#fff1c2' : '#ffc857';
    ctx.beginPath(); ctx.arc(o.x, o.y, w.size, 0, Math.PI * 2); ctx.fill();
  }

  // 光彈：進化後的星河多一條拖尾
  for (const b of game.bullets) {
    if (b.r > 5) {
      ctx.strokeStyle = 'rgba(255,200,87,.35)'; ctx.lineWidth = b.r;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.05, b.y - b.vy * 0.05); ctx.stroke();
    }
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  }

  // 玩家：受傷無敵時閃爍
  if (P.iframe <= 0 || Math.floor(P.iframe * 20) % 2 === 0) {
    ctx.fillStyle = '#ece8f5';
    ctx.beginPath(); ctx.arc(P.x, P.y, P.r, 0, Math.PI * 2); ctx.fill();
    // 手上的燈（朝移動方向）
    ctx.fillStyle = '#ffc857';
    ctx.beginPath(); ctx.arc(P.x + P.faceX * 15, P.y + P.faceY * 15, 5, 0, Math.PI * 2); ctx.fill();
  }
  // 玩家血條
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(P.x - 18, P.y + P.r + 6, 36, 5);
  ctx.fillStyle = '#ff5d73'; ctx.fillRect(P.x - 18, P.y + P.r + 6, 36 * Math.max(0, P.hp / P.maxHp), 5);

  // 擊殺瞬間的白色光環
  for (const p of game.pops) {
    const k = p.age / 0.22;
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * (1 - k)})`;
    ctx.lineWidth = 3 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + 1.4 * k), 0, Math.PI * 2); ctx.stroke();
  }

  // 粒子
  for (const p of game.particles) {
    ctx.globalAlpha = Math.min(1, p.life * 3);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // 傷害數字
  ctx.font = '700 13px "Chakra Petch", monospace';
  ctx.textAlign = 'center';
  for (const t of game.texts) {
    ctx.globalAlpha = Math.min(1, t.life * 3);
    ctx.fillStyle = t.color;
    ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // 夜色暗角：只有燈照得到的地方是亮的
  const g = ctx.createRadialGradient(W / 2, H / 2, 140 * zoom, W / 2, H / 2, Math.max(W, H) * 0.65);
  g.addColorStop(0, 'rgba(5,6,12,0)');
  g.addColorStop(1, 'rgba(5,6,12,.88)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 連殺：10 連以上才顯示，每殺一隻就彈一下
  if (game.combo >= 10 && game.mode !== 'over') {
    const pop = 1 + Math.max(0, 0.12 - game.comboT) * 3;
    const size = Math.min(22 + game.combo / 20, 40) * pop;
    ctx.save();
    if (!hudBottom) hudBottom = $('hud').getBoundingClientRect().bottom;
    ctx.translate(W / 2, hudBottom + 34);
    ctx.textAlign = 'center';
    ctx.globalAlpha = clamp(1.5 - game.comboT, 0, 1);
    ctx.fillStyle = '#ffc857';
    ctx.font = `700 ${size}px "Chakra Petch", monospace`;
    ctx.fillText(game.combo, 0, 0);
    ctx.font = '500 13px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#ece8f5';
    ctx.fillText('連殺', 0, 20);
    ctx.restore();
  }

  // 寶箱在畫面外時，在畫面邊緣畫一個指向它的箭頭
  for (const c of game.gems) {
    if (c.kind !== 'chest') continue;
    const dx = (c.x - P.x) * zoom, dy = (c.y - P.y) * zoom;
    const mx = W / 2 - 30, my = H / 2 - 30;
    if (Math.abs(dx) < mx && Math.abs(dy) < my) continue;
    const k = Math.min(mx / Math.abs(dx || 1e-6), my / Math.abs(dy || 1e-6));
    const ax = W / 2 + dx * k, ay = H / 2 + dy * k, a = Math.atan2(dy, dx);
    ctx.save();
    ctx.translate(ax, ay); ctx.rotate(a);
    ctx.fillStyle = '#ffc857';
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, -9); ctx.lineTo(-8, 9); ctx.fill();
    ctx.restore();
  }

  // 搖桿
  if (stick.id !== null && game.mode === 'play') {
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy, d = Math.hypot(dx, dy);
    const k = d > STICK_R ? STICK_R / d : 1;
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_R, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(stick.ox + dx * k, stick.oy + dy * k, 20, 0, Math.PI * 2); ctx.fill();
  }
}

// 地面：用格子座標做固定的偽隨機，讓草叢位置每次經過都一樣
function drawGround(P) {
  const T = 90, R = viewRadius() + T;
  const x0 = Math.floor((P.x - R) / T), x1 = Math.floor((P.x + R) / T);
  const y0 = Math.floor((P.y - R) / T), y1 = Math.floor((P.y + R) / T);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
    const h = Math.abs(Math.sin(cx * 127.1 + cy * 311.7) * 43758.5453) % 1;
    const x = cx * T + (h * 7 % 1) * T, y = cy * T + (h * 13 % 1) * T;
    if (h < 0.45) {
      ctx.strokeStyle = '#1d2236'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 4, y); ctx.lineTo(x - 6, y - 8);
      ctx.moveTo(x, y); ctx.lineTo(x, y - 11);
      ctx.moveTo(x + 4, y); ctx.lineTo(x + 6, y - 8);
      ctx.stroke();
    } else if (h < 0.6) {
      ctx.fillStyle = '#161a2b';
      ctx.beginPath(); ctx.arc(x, y, 3 + h * 4, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ============================================================
//  介面
// ============================================================
const SCREENS = ['titleScreen', 'levelScreen', 'chestScreen', 'pauseScreen', 'overScreen'];
function showOnly(id) { for (const s of SCREENS) $(s).hidden = s !== id; }

const hudCache = {};
function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
function updateHud() {
  const P = game.player;
  setText('lvl', P.lvl);
  setText('kills', game.kills);
  setText('time', fmtTime(game.t));
  $('xpFill').style.width = (P.xp / P.xpNext * 100).toFixed(1) + '%';
}

function buildHtml() {
  const items = [
    ...game.weapons.map(w => `<span>${WEAPONS[w.id].icon} ${WEAPONS[w.id].name}<em>${WEAPONS[w.id].evolved ? '★' : w.lv}</em></span>`),
    ...Object.entries(game.passives).map(([id, lv]) => `<span>${PASSIVES[id].icon} ${PASSIVES[id].name}<em>${lv}</em></span>`),
  ];
  return items.join('');
}

// 每條配方的狀態：已進化 / 條件達成（等寶箱）/ 尚未達成
function recipesHtml() {
  const ready = evolvable();
  return EVOLUTIONS.map(r => {
    const F = WEAPONS[r.from], N = PASSIVES[r.need], T = WEAPONS[r.into];
    const cls = game.weapons.some(w => w.id === r.into) ? 'done' : ready.includes(r) ? 'ok' : '';
    return `<div class="${cls}">${F.icon} ${F.name} Lv.${F.max} ＋ ${N.icon} ${N.name} → ${T.icon} ${T.name}</div>`;
  }).join('');
}

function togglePause() {
  if (game.mode === 'play') {
    game.mode = 'paused';
    stick.id = null;
    $('pauseBuild').innerHTML = buildHtml();
    $('recipes').innerHTML = recipesHtml();
    showOnly('pauseScreen');
  } else if (game.mode === 'paused') {
    game.mode = 'play';
    last = performance.now();
    showOnly(null);
  }
}

function endGame(win) {
  game.mode = 'over';
  $('hud').hidden = true;
  let best = 0;
  try {
    best = Number(localStorage.getItem('shadowtide-best') || 0);
    if (game.t > best) { best = game.t; localStorage.setItem('shadowtide-best', String(best)); }
  } catch (_) { best = Math.max(best, game.t); }
  $('overTitle').textContent = win ? '天亮了' : '燈熄了';
  $('overTitle').style.color = win ? 'var(--lamp)' : '';
  $('overSub').textContent = (win ? '你撐過了整個黑夜。' : `最佳紀錄 ${fmtTime(best)}`) + `　最高連殺 ${game.bestCombo}`;
  $('rTime').textContent = fmtTime(game.t);
  $('rLvl').textContent = game.player.lvl;
  $('rKills').textContent = game.kills;
  $('overBuild').innerHTML = buildHtml();
  showOnly('overScreen');
}

$('startBtn').onclick = newGame;
const syncMute = () => { $('muteBtn').textContent = sfx.muted ? '🔇' : '🔊'; };
$('muteBtn').onclick = () => { sfx.toggle(); syncMute(); };
syncMute();
$('againBtn').onclick = newGame;
$('quitBtn').onclick = newGame;
$('resumeBtn').onclick = togglePause;
$('pauseBtn').onclick = togglePause;
// 切到別的 App 或分頁時自動暫停
document.addEventListener('visibilitychange', () => { if (document.hidden && game.mode === 'play') togglePause(); });
</script>
